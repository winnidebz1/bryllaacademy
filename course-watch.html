<!DOCTYPE html> 
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Watch your Brylla Academy bookkeeping lessons.">
	<meta name="theme-color" content="#073b70">
	<title>Bookkeeping | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
	<style>
		:root {
			--navy: #073b70;
			--teal: #0a8f84;
			--link: #04635e;
			--bg: #f4f8fb;
			--surface: #fff;
			--border: #e3ebf2;
			--text: #122d49;
			--muted: #4b5f73;
			--blue-bg: #e3edf8;
			--blue-fg: #0b4a85;
			--green-bg: #dff3ec;
			--green-fg: #04635e;
			--s1: 4px;
			--s2: 8px;
			--s3: 12px;
			--s4: 16px;
			--s5: 24px;
			--header: 54px;
		}
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 Inter, system-ui, "Segoe UI", sans-serif; }
		a { color: var(--link); }
		h1, h2, p { margin: 0; }
		button, a { font-family: inherit; }
		.skip { position: absolute; left: -999px; top: 0; }
		.skip:focus { left: var(--s4); top: var(--s2); background: var(--navy); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 30; }
		.site-head { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 25; }
		.site-head .in { margin: 0 auto; padding: 0 var(--s4); height: var(--header); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
		.head-left, .head-right { display: flex; align-items: center; gap: var(--s2); }
		.brand { display: flex; align-items: center; text-decoration: none; color: var(--navy); }
		.brand-mark { position: relative; width: 84px; height: 44px; overflow: hidden; display: block; }
		.brand-mark img { position: absolute; width: 107px; height: 107px; max-width: none; top: calc(50% + 4px); left: 50%; transform: translate(-50%, -50%); }
		.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: var(--navy); font-size: 24px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
		.icon-btn:hover { background: var(--blue-bg); }
		.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-bg); color: var(--navy); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
		.scrim { position: fixed; inset: var(--header) 0 0 0; background: rgba(0, 0, 0, .35); z-index: 15; }
		.scrim[hidden] { display: none; }
		.drawer { position: fixed; top: var(--header); left: 0; bottom: 0; width: min(280px, 85vw); background: var(--surface); border-right: 1px solid var(--border); padding: var(--s4) var(--s3); transform: translateX(-100%); visibility: hidden; transition: transform .2s, visibility 0s .2s; z-index: 20; overflow: auto; }
		.drawer.open { transform: none; visibility: visible; transition: transform .2s, visibility 0s; }
		.drawer .grp { margin: var(--s3) var(--s2) var(--s1); font-size: 12px; font-weight: 500; color: var(--muted); }
		.drawer a { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s2); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 15px; }
		.drawer a:hover { background: var(--bg); }
		.drawer a.out { color: #a1243a; }
		.drawer i { font-size: 20px; }
		.lay { max-width: 1200px; margin: 0 auto; padding: var(--s5) var(--s4); display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--s5); align-items: start; }
		.side { grid-column: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
		.main { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: var(--s5); }
		.side .top { padding: var(--s4); }
		.side .back { font-size: 13px; font-weight: 500; text-decoration: none; }
		.side h2 { margin: 10px 0; font-size: 17px; font-weight: 500; }
		.bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
		.bar > span { display: block; height: 100%; background: var(--teal); }
		.plabel { font-size: 12px; color: var(--muted); margin-top: 6px; }
		details { border-top: 1px solid var(--border); }
		summary { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 var(--s4); cursor: pointer; font-size: 14px; list-style: none; }
		summary::-webkit-details-marker { display: none; }
		summary .t { flex: 1; font-weight: 500; }
		summary .s { font-size: 12px; color: var(--muted); }
		details[open] summary .chev { transform: rotate(180deg); }
		.lessons { padding: 0 var(--s2) var(--s3); }
		.lr { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; color: var(--text); text-align: left; }
		button.lr { cursor: pointer; }
		button.lr:hover { background: var(--bg); }
		.lr.cur { background: var(--green-bg); color: var(--green-fg); font-weight: 500; }
		.lr.lock { color: var(--muted); }
		.lr i { font-size: 18px; flex-shrink: 0; }
		.lr .nm { flex: 1; }
		.lr .m { font-size: 12px; color: var(--muted); white-space: nowrap; }
		.lr.cur .m { color: var(--green-fg); }
		.tag { font-size: 12px; background: var(--green-bg); color: var(--green-fg); padding: 1px 8px; border-radius: 8px; }
		.module-assignment { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin: var(--s2) var(--s2) 0; padding: var(--s3); border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
		.module-assignment strong { display: block; font-size: 13px; font-weight: 500; }
		.module-assignment p { margin-top: 2px; color: var(--muted); font-size: 12px; }
		.module-assignment .btn { min-height: 38px; padding: 0 14px; white-space: nowrap; }
		.module-assignment { align-items: stretch; flex-direction: column; }
		.module-assignment-instructions { margin-top: var(--s2); padding: var(--s3); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
		.module-assignment-empty { color: var(--muted); font-style: italic; }
		.note { border-top: 1px solid var(--border); padding: 14px var(--s4); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
		.video { aspect-ratio: 16/9; background: #0a2a47; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
		.video video { width: 100%; height: 100%; display: block; background: #000; }
		.video .msg { color: #fff; text-align: center; padding: var(--s4); display: flex; flex-direction: column; align-items: center; gap: var(--s2); }
		.video .msg i { font-size: 36px; }
		.video .msg small { color: #dbe7fb; font-size: 13px; }
		.main h1 { font-size: 22px; font-weight: 500; }
		.main .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
		.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
		.btn { min-height: 44px; padding: 0 22px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
		.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
		.btn[disabled] { background: #eef3f8; color: var(--muted); cursor: default; }
		.status { font-size: 14px; color: var(--green-fg); }
		.tabs { display: flex; gap: var(--s2); margin-bottom: var(--s3); }
		.tab { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
		.tab[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
		.panel { font-size: 15px; line-height: 1.7; color: var(--muted); }
		.panel textarea { width: 100%; font: inherit; font-size: 14px; padding: var(--s3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
		.assignment-dialog { width: min(480px, calc(100% - 32px)); max-height: min(90vh, 680px); padding: 0; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: 0 18px 50px rgba(4, 31, 60, .22); }
		.assignment-dialog::backdrop { background: rgba(4, 31, 60, .5); }
		.assignment-form { padding: var(--s5); }
		.assignment-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
		.assignment-dialog-head h2 { font-size: 19px; font-weight: 500; }
		.assignment-module-name { margin-top: var(--s1); color: var(--muted); font-size: 14px; }
		.assignment-close { width: 36px; height: 36px; flex: 0 0 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
		.assignment-close:hover { background: var(--bg); color: var(--text); }
		.assignment-field { display: block; margin-bottom: var(--s4); }
		.assignment-field > span { display: block; margin-bottom: var(--s2); font-size: 14px; font-weight: 500; }
		.assignment-file { width: 100%; min-height: 44px; padding: var(--s2); border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
		.assignment-description { width: 100%; min-height: 112px; resize: vertical; padding: var(--s3); border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
		.assignment-help { margin-top: var(--s1); color: var(--muted); font-size: 12px; }
		.assignment-status { min-height: 1.5em; margin: 0 0 var(--s3); color: #a1243a; font-size: 13px; }
		.assignment-dialog-actions { display: flex; justify-content: flex-end; gap: var(--s2); }
		:focus-visible { outline: 3px solid var(--blue-fg); outline-offset: 2px; }
		@media (min-width: 821px) {
			.lay { grid-template-columns: 300px minmax(0, 1fr); }
			.side { grid-column: 1; grid-row: 1; }
			.main { grid-column: 2; grid-row: 1; }
		}
		@media (max-width: 820px) {
			.lay { grid-template-columns: minmax(0, .72fr) minmax(0, 1.28fr); gap: var(--s3); padding: var(--s4) var(--s3); }
			.side { grid-column: 1; grid-row: 1; }
			.main { grid-column: 2; grid-row: 1; }
		}
		@media (max-width: 560px) {
			.lay { grid-template-columns: 1fr; }
			.main { grid-column: 1; grid-row: 1; }
			.side { grid-column: 1; grid-row: 2; }
			.module-assignment { align-items: stretch; flex-direction: column; }
		}
		@media (max-width: 767px) {
			:root { --header: calc(52px + env(safe-area-inset-top)); }
			.site-head .in { padding-top: env(safe-area-inset-top); }
			.brand-mark { width: 64px; height: 36px; }
		}
		@media (prefers-reduced-motion: reduce) {
			.drawer { transition: none; }
		}
	</style>
	</head>

	<header class="site-head">
		<div class="in">
			<div class="head-left">
				<a class="brand" href="student-dashboard.html" aria-label="Brylla Academy home">
					<span class="brand-mark"><img src="assets/img/logo.png" alt=""></span>
				</a>
				<button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
								</div>
			<div class="head-right">
				<a class="icon-btn" href="student-notifications.html" aria-label="Notifications, no unread"><i class="ti ti-bell" aria-hidden="true"></i></a>
				<a class="avatar" id="avatar" href="student-settings.html"></a>

				</div>

	<div class="scrim" id="scrim" hidden></div>
	<nav class="drawer" id="drawer" aria-label="Student menu" inert>
		<p class="grp">Main</p>
		<a href="student-dashboard.html"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>Dashboard</a>

		<a href="student-courses.html"><i class="ti ti-school" aria-hidden="true"></i>My courses</a>

	<div class="lay">
		<main class="main" id="main"></main>
		<nav class="side" aria-label="Course content">
			<div class="top">
				<a class="back" href="student-courses.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> My courses</a>
				<h2 id="ctitle">Bookkeeping</h2>
				<div class="bar" id="pbar" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pfill"></span></div>
				<div class="plabel" id="plabel"></div>
			</div>
			<div id="weeks"></div>
			<div class="note" id="locknote"><i class="ti ti-lock" aria-hidden="true"></i> Other lessons unlock after you enrol</div>
		</nav>
									</div>
	<dialog class="assignment-dialog" id="assignment-dialog" aria-labelledby="assignment-dialog-title">
		<form class="assignment-form" id="assignment-form">
			<div class="assignment-dialog-head">
													<div>
					<h2 id="assignment-dialog-title">Submit assignment</h2>
					<p class="assignment-module-name" id="assignment-module-name"></p>
				</div>
				<button class="assignment-close" type="button" id="assignment-close" aria-label="Close dialog">&times;</button>

			<label class="assignment-field" for="assignment-file">

				<input class="assignment-file" type="file" id="assignment-file" name="assignmentFile" accept=".jpg,.jpeg,.pdf,image/jpeg,application/pdf" required>
				<span class="assignment-help">Accepted formats: JPG or PDF.</span>
			</label>
			<label class="assignment-field" for="assignment-description">
				<span>Description</span>
				<textarea class="assignment-description" id="assignment-description" name="description" placeholder="Add a note about your submission (optional)"></textarea>
			</label>
			<p class="assignment-status" id="assignment-status" role="status" aria-live="polite"></p>

				<button class="btn primary" type="submit">Submit assignment</button>

	</dialog>

	<script src="assets/js/brylla-student.js"></script>
	<script>
		var SUMMARIES = {
			w1l1: "What a US bookkeeper does, and how the work fits a client's books.",
			w1l2: "Debits, credits, and the journal entries behind every transaction.",
			w1l3: "How a chart of accounts groups what a business owns, owes, and earns.",
			w2l1: "Set up a company in QuickBooks Online and find your way around.",
			w2l2: "Bank feeds, bank rules, and categorizing everyday transactions.",
			w2l3: "Record money customers owe and apply the payments that come in.",
			w3l1: "Record bills and payments in accounts payable.",
			w3l2: "Match the books to the bank statement and find the differences.",
			w3l3: "Reconcile a credit card the same way you reconcile a bank account.",
			w4l1: "Record fixed assets and spread their cost with depreciation.",
			w4l2: "Amortize costs, and record prepaid expenses and accruals.",
			w4l3: "Set up a loan and record the principal and interest.",
			w5l1: "Take a company from setup to reports in Xero.",
			w5l2: "Record Stripe sales and match the payout to the bank.",
			w5l3: "Record PayPal activity and reconcile merchant payouts.",
			w6l1: "Close the month and read the financial reports.",
			w6l2: "Clean up a real set of books that has fallen behind.",
			w6l3: "Find bookkeeping work, write applications, and use AI with care."
		};
		var PRICE = "GHS 950";
		var ENROL_URL = "checkout.html?course=bookkeeping";

		var $ = function (id) { return document.getElementById(id); };
		var esc = function (value) {
			return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
				return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
			});
		};

		var ALL = [];
		BryllaStudent.modules.forEach(function (module) {
			module.lessons.forEach(function (title, index) {
				var id = "w" + module.week + "l" + (index + 1);
				ALL.push({ id: id, kind: "lesson", week: module.week, topic: module.title, n: index + 1, title: title, min: BryllaStudent.lessonMinutes, preview: false, summary: SUMMARIES[id] || title });
			});
			ALL.push({ id: "w" + module.week + "live", kind: "live", week: module.week, topic: module.title, n: 0, title: module.live, min: 60, preview: false, summary: "A live session with your instructor." });
		});

		var enrolled = BryllaStudent.courseRecord("bookkeeping").enrolled;
		if (enrolled) BryllaStudent.startCourse();
		var sel = null;
		var tab = "o";
		var statusText = "";
		var assignmentDialog = $("assignment-dialog");
		var assignmentForm = $("assignment-form");
		var ASSIGNMENT_KEY = "brylla-module-assignment-instructions";
		var assignmentInstructions = {};
		var assignmentStorageError = "";
		try {
			var savedInstructions = localStorage.getItem(ASSIGNMENT_KEY);
			if (savedInstructions) {
				assignmentInstructions = JSON.parse(savedInstructions);
				if (!assignmentInstructions || typeof assignmentInstructions !== "object" || Array.isArray(assignmentInstructions)) {
					throw new Error("Saved assignment instructions have an invalid format.");
				}
			}
		} catch (error) {
			assignmentInstructions = {};
			assignmentStorageError = "Assignment instructions could not be loaded from this browser.";
		}

		function itemById(id) {
			for (var i = 0; i < ALL.length; i += 1) if (ALL[i].id === id) return ALL[i];
			return null;
		}
		function progressSets() {
			var progress = BryllaStudent.loadProgress();
			var done = {};
			var attended = {};
			progress.completedLessonIds.forEach(function (id) { done[id] = true; });
			progress.attendedLiveIds.forEach(function (id) { attended[id] = true; });
			return { done: done, attended: attended };
		}
		function isDone(item, sets) {
			return item.kind === "live" ? Boolean(sets.attended[item.id]) : Boolean(sets.done[item.id]);
		}
		function initials(name) {
			return name.trim().split(/\s+/).slice(0, 2).map(function (part) { return part.charAt(0); }).join("").toUpperCase() || "AM";
		}

		function lessonRow(item, sets) {
			var locked = !enrolled;
			var current = item === sel && enrolled;
			var finished = isDone(item, sets);
			var icon = finished ? "ti-circle-check" : current ? "ti-player-play-filled" : locked ? "ti-lock" : "ti-circle";
			var color = finished && !current ? ' style="color:var(--green-fg)"' : "";
			var extra = '<span class="m">' + (item.kind === "live" ? "Live" : item.min + " min") + "</span>";
			var inner = '<i class="ti ' + icon + '"' + color + ' aria-hidden="true"></i><span class="nm">' + esc(item.kind === "live" ? "Live: " + item.title : item.title) + "</span>" + extra;
			if (locked) return '<div class="lr lock">' + inner + "</div>";
			return '<button class="lr' + (current ? " cur" : "") + '" type="button" data-id="' + esc(item.id) + '"' + (current ? ' aria-current="true"' : "") + ">" + inner + "</button>";
		}

		function moduleAssignment(module) {
			var instructions = assignmentInstructions[String(module.week)] || "";
			var displayedInstructions = instructions
				? '<div class="module-assignment-instructions">' + esc(instructions) + "</div>"
				: '<div class="module-assignment-instructions module-assignment-empty">Your instructor has not posted instructions for this module yet.</div>';
			var error = assignmentStorageError
				? '<p class="status" role="status">' + esc(assignmentStorageError) + "</p>"
				: "";
			return '<section class="module-assignment" aria-label="Assignment for ' + esc(module.title) + '">' +
				'<div><strong>Assignment instructions</strong><p>Instructions for this module\'s assignment.</p></div>' +
				'<div data-instructions-display="' + module.week + '">' + displayedInstructions + "</div>" + error +
				'<button class="btn primary" type="button" data-a="assignment" data-module-title="' + esc(module.title) + '" aria-label="Submit assignment for ' + esc(module.title) + '">Submit assignment</button>' +
				"</section>";
		}

		function renderSide() {
			var summary = BryllaStudent.summary();
			var sets = progressSets();
			var pct = enrolled ? summary.percentComplete : 0;
			var doneCount = enrolled ? summary.lessonsDone : 0;
			var total = BryllaStudent.lessons.length;
			$("ctitle").textContent = "Bookkeeping";
			$("pfill").style.width = pct + "%";
			$("pbar").setAttribute("aria-valuenow", String(pct));
			$("plabel").textContent = pct + "% complete, " + doneCount + " of " + total + " lessons";
			$("weeks").innerHTML = BryllaStudent.modules.map(function (module) {
				var lessons = ALL.filter(function (item) { return item.week === module.week && item.kind === "lesson"; });
				var rows = ALL.filter(function (item) { return item.week === module.week; });
				var finished = lessons.filter(function (item) { return sets.done[item.id]; }).length;
				var open = rows.indexOf(sel) !== -1;
				var status = finished === lessons.length && finished > 0 ? "Done" : finished + " of " + lessons.length;
				var assignment = moduleAssignment(module);
				return '<details' + (open ? " open" : "") + '><summary><span class="t">Week ' + module.week + '</span><span class="s">' + status + '</span><i class="ti ti-chevron-down chev" aria-hidden="true"></i></summary><div class="lessons">' + rows.map(function (item) { return lessonRow(item, sets); }).join("") + assignment + "</div></details>";
			}).join("");
			$("locknote").hidden = enrolled;
		}

		function openAssignment(moduleTitle) {
			assignmentForm.reset();
			$("assignment-status").textContent = "";
			$("assignment-module-name").textContent = moduleTitle;
			assignmentDialog.showModal();
		}

		function renderMain() {
			var sets = progressSets();
			var summary = BryllaStudent.summary();
			var can = enrolled;
			var last = sel === ALL[ALL.length - 1];
			var video;
			if (can && sel.kind === "lesson") {
				video = '<div class="msg"><i class="ti ti-player-play" aria-hidden="true"></i><small>This lesson\'s video will play here when it is added.</small></div>';
			} else if (can && sel.kind === "live") {
				video = '<div class="msg"><i class="ti ti-broadcast" aria-hidden="true"></i><strong>' + esc(sel.title) + '</strong><small>Live session. Mark attended after you join.</small></div>';
			} else {
				video = '<div class="msg"><i class="ti ti-lock" aria-hidden="true"></i><strong>Enrol to start learning</strong><small>Course lessons unlock after you enrol.</small></div>';
			}
			var head = can
				? "<h1>" + esc(sel.title) + "</h1><p class=\"sub\">Week " + sel.week + (sel.kind === "live" ? ", live session" : ", lesson " + sel.n) + "</p>"
				: "<h1>Study Materials</h1><p class=\"sub\">Bookkeeping course resources</p>";
			var actions = "";
			if (enrolled && sel.kind === "lesson") {
				var finished = Boolean(sets.done[sel.id]);
				var currentId = summary.lessonId;
				if (finished) actions += '<button class="btn" type="button" disabled aria-pressed="true"><i class="ti ti-circle-check" aria-hidden="true"></i>Completed</button>';
				else if (sel.id !== currentId) actions += '<button class="btn" type="button" disabled>Finish the current lesson first</button>';
				else actions += '<button class="btn" type="button" data-a="done"><i class="ti ti-circle-check" aria-hidden="true"></i>Mark complete</button>';
				if (!last) actions += '<button class="btn primary" type="button" data-a="next">Next lesson <i class="ti ti-arrow-right" aria-hidden="true"></i></button>';
			} else if (enrolled && sel.kind === "live") {
				if (sets.attended[sel.id]) actions += '<button class="btn" type="button" disabled>Attendance saved</button>';
				else actions += '<button class="btn" type="button" data-a="attend"><i class="ti ti-circle-check" aria-hidden="true"></i>Mark attended</button>';
				if (!last) actions += '<button class="btn primary" type="button" data-a="next">Next lesson <i class="ti ti-arrow-right" aria-hidden="true"></i></button>';
			} else {
				actions = '<a class="btn primary" href="#study-materials">View here</a>';
			}
			if (summary.completed) actions += '<a class="btn" href="student-certificates.html">View certificate</a>';
			if (!can) tab = "r";
			else if (tab === "r") tab = "o";
			var body;
			if (tab === "o") body = '<div class="panel">' + esc(sel.summary) + "</div>";
			else if (tab === "n") body = '<div class="panel"><textarea id="note" rows="4" aria-label="Your note for this lesson" placeholder="Add a note for this lesson"></textarea></div>';
			else body = "";
			var tabItems = can ? [["o", "Overview"], ["n", "Notes"]] : [];
			var tabs = can
				? '<div><div class="tabs" role="group" aria-label="Lesson sections">' +
					tabItems.map(function (item) {
						return '<button class="tab" type="button" data-t="' + item[0] + '" aria-pressed="' + (tab === item[0]) + '">' + item[1] + "</button>";
					}).join("") + "</div>" + body + "</div>"
				: "";
			var materials = '<section class="panel" id="study-materials"><h2>Study Materials</h2><p>Study materials will be available here.</p></section>';
			var status = statusText ? '<p class="status" role="status">' + esc(statusText) + "</p>" : "";
			$("main").innerHTML = '<div class="video">' + video + "</div><div>" + head + '</div><div class="actions">' + actions + "</div>" + status + tabs + materials;
			var note = $("note");
			if (note) {
				try { note.value = localStorage.getItem("note:" + sel.id) || ""; } catch (error) { note.value = ""; }
				note.addEventListener("input", function () {
					try { localStorage.setItem("note:" + sel.id, note.value); } catch (error) { /* notes stay on this page until storage is available */ }
				});
			}
		}

		function render() {
			if (!sel) {
				sel = enrolled ? itemById(BryllaStudent.summary().lessonId) || ALL[0] : ALL[0];
			}
			renderSide();
			renderMain();
		}

		document.addEventListener("click", function (event) {
			var button = event.target.closest("[data-id],[data-a],[data-t]");
			if (!button || !$("main").contains(button) && !$("weeks").contains(button)) return;
			if (button.dataset.id) {
				var nextItem = itemById(button.dataset.id);
				if (!nextItem || !enrolled) return;
				sel = nextItem;
			} else if (button.dataset.a === "done") {
				var saved = BryllaStudent.completeLesson(sel.id);
				statusText = "Lesson saved. " + saved.lessonsDone + " of " + saved.lessonsTotal + " lessons done.";
				sel = itemById(saved.lessonId) || sel;
			} else if (button.dataset.a === "attend") {
				var attended = BryllaStudent.attendLive(sel.id);
				statusText = "Attendance saved. " + attended.attendancePercent + "% of live sessions attended.";
			} else if (button.dataset.a === "next") {
				var index = ALL.indexOf(sel);
				if (ALL[index + 1]) sel = ALL[index + 1];
			} else if (button.dataset.a === "assignment") {
				openAssignment(button.dataset.moduleTitle);
			} else if (button.dataset.t) {
				tab = button.dataset.t;
			}
			if (button.dataset.a !== "assignment") render();
		});
		$("assignment-close").addEventListener("click", function () { assignmentDialog.close(); });
		$("assignment-cancel").addEventListener("click", function () { assignmentDialog.close(); });
		assignmentForm.addEventListener("submit", function (event) {
			event.preventDefault();
			$("assignment-status").textContent = "Online assignment submission is not connected yet. Your file has not been uploaded.";
		});

		var profile = BryllaStudent.loadProfile();
		var studentName = profile ? profile.name : "Ama Mensah";
		$("avatar").textContent = initials(studentName);
		$("avatar").setAttribute("aria-label", "Settings, " + studentName);
		render();

		var menuBtn = $("menu-btn");
		var drawer = $("drawer");
		var scrim = $("scrim");
		function setMenu(open) {
			drawer.classList.toggle("open", open);
			scrim.hidden = !open;
			drawer.inert = !open;
			menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
			menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
			menuBtn.querySelector("i").className = "ti " + (open ? "ti-x" : "ti-menu-2");
			document.body.style.overflow = open ? "hidden" : "";
			if (open) drawer.querySelector("a").focus();
		}
		menuBtn.addEventListener("click", function () { setMenu(!drawer.classList.contains("open")); });
		scrim.addEventListener("click", function () { setMenu(false); menuBtn.focus(); });
		drawer.addEventListener("click", function (event) { if (event.target.closest("a")) setMenu(false); });
		document.addEventListener("keydown", function (event) {
			if (event.key === "Escape" && drawer.classList.contains("open")) { setMenu(false); menuBtn.focus(); }
		});
		window.addEventListener("storage", function (event) {
			if (event.key !== "brylla-course-progress" && event.key !== "brylla-student-profile" && event.key !== ASSIGNMENT_KEY) return;
			if (event.key === ASSIGNMENT_KEY) {
				try {
					var updatedInstructions = JSON.parse(localStorage.getItem(ASSIGNMENT_KEY) || "{}");
					if (!updatedInstructions || typeof updatedInstructions !== "object" || Array.isArray(updatedInstructions)) throw new Error("Saved assignment instructions have an invalid format.");
					assignmentInstructions = updatedInstructions;
					assignmentStorageError = "";
				} catch (error) {
					assignmentInstructions = {};
					assignmentStorageError = "Assignment instructions could not be loaded from this browser.";
				}
			}
			enrolled = BryllaStudent.courseRecord("bookkeeping").enrolled;
			if (enrolled) BryllaStudent.startCourse();
			render();
		});
	</script>
	</body>
</html>
