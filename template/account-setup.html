<!DOCTYPE html>
<html lang="en">
<head>
	<script src="assets/js/brylla-errors.js"></script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign up | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { margin: 0; font-family: Raleway, "Segoe UI", Arial, sans-serif; background: #f4f8fb; color: #122d49; }
		main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
		.card { background: #fff; border: 1px solid #e3ebf2; border-radius: 16px; padding: 20px; }
		.btn { display: inline-block; margin-top: 16px; margin-right: 8px; background: #073b70; color: #fff; border-radius: 999px; padding: 12px 18px; font-weight: 700; text-decoration: none; }
		.btn.quiet { background: #fff; color: #073b70; border: 1px solid #bfd0df; }
	</style>
</head>
<body>
	<main>
		<a href="/"><img src="assets/img/logo.png" alt="Brylla Academy" width="120"></a>
		<div class="card">
			<h1>Sign up</h1>
			<p>Choose your name, email, and password on the sign-up page. If you already have an account, sign in.</p>
			<a class="btn" href="register">Sign up</a>
			<a class="btn quiet" href="login">Login</a>
		</div>
	</main>
</body>
</html>
