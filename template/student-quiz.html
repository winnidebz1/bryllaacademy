<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/js/brylla-errors.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Take your Brylla Academy quizzes.">
<title>Quizzes | Brylla Academy</title>
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
<style>
:root{--surface-1:#f4f8fb;--surface-2:#fff;--border:#e3ebf2;--border-strong:#c5d4e2;--bg-accent:#e7f0f8;--text-accent:#083b6c;--text-secondary:#4d5d6c;--text-warning:#9a4e12;--bg-success:#e5f8f4;--text-success:#04635e;--bg-warning:#fff1e6;--text-danger:#b42318}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface-1);color:#122d49;font-family:Raleway,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5}
button,input{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#qz{background:var(--surface-1);border-radius:12px;overflow:hidden}
#qz .hd{background:#fff;border-bottom:1px solid #e3ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1000px)/2));height:64px}
#qz .brand{display:flex;align-items:center;text-decoration:none}
#qz .brand img{display:block;width:92px;height:52px;object-fit:contain}
#qz .exit{font-size:14px;font-weight:500;color:#0f6b6b;text-decoration:none}
#qz .exit:hover{text-decoration:underline}
#qz .wrap{max-width:560px;margin:0 auto;padding:24px 16px 28px}
#qz .card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:20px}
#qz .opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;font-size:15px;margin-bottom:10px}
#qz .opt:hover{border-color:#083b6c}
#qz .opt.on{border:2px solid #083b6c;padding:12px 14px;background:var(--bg-accent)}
#qz input[type=radio]{margin-top:4px;accent-color:#083b6c;flex-shrink:0}
#qz .b{height:44px;border-radius:22px;padding:0 22px;font-weight:500}
#qz .b.p{background:#083b6c;color:#fff;border:none}
#qz .dot{width:36px;height:36px;border-radius:50%;padding:0;font-size:13px}
#qz .dot.a{background:var(--bg-accent);color:var(--text-accent)}
#qz .dot[aria-current="step"]{border:2px solid #083b6c}
#qz h2:focus{outline:none}
#qz .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
#qz .rv{padding:14px 0;border-top:0.5px solid var(--border)}
#qz .ql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#qz .qi{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"w c" "s c" "m c";align-items:center;column-gap:12px;text-align:left;padding:16px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface-2);color:inherit;font:inherit;cursor:pointer}
#qz .qi:hover{border-color:#083b6c}
#qz .qi:focus-visible{outline:3px solid #f28a3c;outline-offset:2px}
#qz .qi.off{cursor:default;opacity:.65}
#qz .qi.off:hover{border-color:var(--border)}
#qz .qw{grid-area:w;font-size:12px;font-weight:500;color:#0f6b6b;text-transform:uppercase;letter-spacing:.04em}
#qz .qs{grid-area:s;font-size:16px;font-weight:500;margin:2px 0}
#qz .qm{grid-area:m;font-size:13px;color:var(--text-secondary)}
#qz .qc{grid-area:c;font-size:20px;color:#083b6c}
#qz .lnk{border:0;background:none;padding:0;font-size:14px;color:#0f6b6b;font-weight:500;cursor:pointer}
#qz .lnk:hover{text-decoration:underline}
</style>
<h2 class="sr-only">Student quizzes: choose a subject, then take its quiz one question at a time with a timer, and review your answers</h2>
<div id="qz">
  <div class="hd">
    <a class="brand" href="student-dashboard.html" aria-label="Brylla Academy home"><img src="assets/img/logo.png" alt="Brylla Academy"></a>
    <div style="display:flex;align-items:center;gap:12px"><button class="note-bell" type="button" data-student-notifications aria-label="Notifications"></button><a class="exit" href="student-dashboard.html">Back to dashboard</a></div>
  </div>
  <div class="wrap" id="body"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/brylla-public-config.js"></script>
<script src="assets/js/brylla-auth.js" data-guard="student"></script>
<script src="assets/js/brylla-notifications.js"></script>
<script src="assets/js/brylla-student.js"></script>
<script>
(function(){
var MODULES=(window.BryllaStudent&&BryllaStudent.modules)||[];
var MAX=2;
var st={s:"list",quiz:null,i:0,a:[],t:0,iv:null,attempt:null,review:null,result:null};
var root=document.getElementById("body");
var Q=[];
var QUIZZES=[];
function api(){return window.BryllaAuth&&BryllaAuth.client;}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function fmt(t){var m=Math.floor(Math.max(t,0)/60),s=Math.max(t,0)%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function stop(){clearInterval(st.iv);st.iv=null;}
function unans(){var n=0;for(var i=0;i<Q.length;i++){if(st.a[i]===undefined)n++;}return n;}
function catalog(remote){
 var by={};
 (remote||[]).forEach(function(quiz){by[String(quiz.module_key)]=quiz;});
 var rows=[{key:"getting-started",week:0,subject:"Getting started"}].concat(MODULES.map(function(module){return {key:String(module.week),week:module.week,subject:module.title};}));
 QUIZZES=rows.map(function(row){
  var live=by[row.key];
  return {id:live?live.id:null,key:row.key,week:row.week,subject:row.subject,topic:live?live.title:"",minutes:live?Number(live.minutes)||0:0,pass:live?live.pass_percent:70,count:live?Number(live.question_count)||0:0,att:live?Number(live.attempts_used)||0:0,ready:Boolean(live&&Number(live.question_count)>0)};
 });
}
function open(id){
 var quiz=QUIZZES.filter(function(item){return item.id===id&&item.ready;})[0];
 if(!quiz||!api())return;
 stop();
 root.innerHTML='<p style="color:var(--text-secondary)">Loading questions…</p>';
 api().rpc("student_quiz_questions",{p_quiz:quiz.id}).then(function(result){
  if(result.error||!result.data){root.innerHTML='<div class="card">'+(result.error?esc(result.error.message):"This quiz is not available.")+'</div>';return;}
  Q=result.data.map(function(item){return {q:item.prompt,o:item.choices||[]};});
  st.quiz=quiz;st.s="intro";st.review=null;st.result=null;draw();
 });
}
function toList(){stop();st.s="list";st.quiz=null;Q=[];load();}
function begin(){
 if(!st.quiz||st.quiz.att>=MAX||!api())return;
 api().rpc("start_quiz_attempt",{p_quiz:st.quiz.id}).then(function(result){
  if(result.error||!result.data){root.innerHTML='<div class="card">'+(result.error?esc(result.error.message):"The quiz could not be started.")+' <button type="button" class="lnk" data-a="list">Back to quizzes</button></div>';return;}
  st.attempt=result.data.attempt_id;
  st.t=Number(result.data.seconds_left)||st.quiz.minutes*60;
  st.s="q";st.i=0;st.a=[];
  stop();st.iv=setInterval(tick,1000);draw();
 });
}
function tick(){st.t--;var el=document.getElementById("tm");if(el){el.textContent=fmt(st.t);el.style.color=st.t<=60?"var(--text-warning)":"";}if(st.t<=0)submit();}
function submit(){
 stop();
 if(!api()||!st.attempt)return;
 var answers=Q.map(function(_,index){return st.a[index]===undefined?-1:st.a[index];});
 root.innerHTML='<p style="color:var(--text-secondary)">Scoring your quiz…</p>';
 api().rpc("submit_quiz_attempt",{p_attempt:st.attempt,p_answers:answers}).then(function(result){
  if(result.error||!result.data){root.innerHTML='<div class="card">'+(result.error?esc(result.error.message):"The quiz could not be scored.")+'</div>';return;}
  st.result=result.data;st.review=result.data.review||[];st.quiz.att+=1;st.s="r";draw();
 });
}
function list(){
 var items=QUIZZES.map(function(item){
  var label='<span class="qw">'+(item.week?"Week "+item.week:"Start")+'</span><span class="qs">'+esc(item.subject)+'</span>';
  if(!item.ready)return '<li><div class="qi off" aria-disabled="true">'+label+'<span class="qm">Not open yet</span></div></li>';
  var meta=esc(item.topic)+' · '+item.count+' questions · '+item.minutes+' minutes';
  return '<li><button type="button" class="qi" data-a="open" data-id="'+item.id+'">'+label+'<span class="qm">'+meta+'</span><i class="ti ti-chevron-right qc" aria-hidden="true"></i></button></li>';
 }).join("");
 return '<h2 id="hd" tabindex="-1" style="margin:0 0 4px;font-size:22px;font-weight:500">Quizzes</h2>'+
 '<p style="margin:0 0 16px;font-size:14px;color:var(--text-secondary)">Choose a subject to open its quiz. Your score is calculated when you submit.</p>'+
 (items?'<ul class="ql">'+items+'</ul>':'<div class="card">No quizzes yet. They appear here when your course opens.</div>');
}
function intro(){
 var x=st.quiz,left=x.att<MAX;
 return '<div class="card"><i class="ti ti-clipboard-check" style="font-size:32px;color:#0a8f84" aria-hidden="true"></i>'+
 '<h2 id="hd" tabindex="-1" style="margin:8px 0 2px;font-size:22px;font-weight:500">'+esc(x.subject)+'</h2>'+
 '<p style="margin:0 0 16px;font-size:14px;color:var(--text-secondary)">'+esc(x.topic)+'</p>'+
 '<ul style="list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px">'+
 '<li><i class="ti ti-help-circle" style="margin-right:10px;color:var(--text-secondary)" aria-hidden="true"></i>'+Q.length+' questions</li>'+
 '<li><i class="ti ti-clock" style="margin-right:10px;color:var(--text-secondary)" aria-hidden="true"></i>'+x.minutes+' minutes</li>'+
 '<li><i class="ti ti-target" style="margin-right:10px;color:var(--text-secondary)" aria-hidden="true"></i>Pass mark: '+x.pass+'%</li>'+
 '<li><i class="ti ti-refresh" style="margin-right:10px;color:var(--text-secondary)" aria-hidden="true"></i>Attempts used: '+x.att+' of '+MAX+'</li></ul>'+
 '<p style="margin:0 0 18px;font-size:13px;color:var(--text-secondary)">'+(left?'You can move between questions. Your answers are scored when you submit.':'No attempts left, ask your instructor for help.')+'</p>'+
 '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+(left?'<button class="b p" data-a="start">Start quiz</button>':'')+'<button type="button" class="lnk" data-a="list">Back to quizzes</button></div></div>';
}
function question(){
 var q=Q[st.i],last=st.i===Q.length-1,u=unans();
 var opts=q.o.map(function(t,k){var on=st.a[st.i]===k;return '<label class="opt'+(on?' on':'')+'"><input type="radio" name="q'+st.i+'" value="'+k+'"'+(on?' checked':'')+'><span>'+esc(t)+'</span></label>';}).join("");
 var dots=Q.map(function(x,k){var a=st.a[k]!==undefined;return '<button class="dot'+(a?' a':'')+'" data-a="go" data-n="'+k+'"'+(k===st.i?' aria-current="step"':'')+' aria-label="Question '+(k+1)+(a?', answered':', not answered')+'">'+(k+1)+'</button>';}).join("");
 return '<p style="margin:0 0 8px;font-size:13px;color:var(--text-secondary)">'+esc(st.quiz.subject)+'</p>'+
 '<div class="row" style="margin-bottom:10px"><span style="font-size:14px;color:var(--text-secondary)">Question '+(st.i+1)+' of '+Q.length+'</span><span style="font-size:14px"><i class="ti ti-clock" style="margin-right:4px;vertical-align:-2px" aria-hidden="true"></i><span id="tm">'+fmt(st.t)+'</span></span></div>'+
 '<div role="progressbar" aria-label="Quiz progress" aria-valuenow="'+(st.i+1)+'" aria-valuemin="1" aria-valuemax="'+Q.length+'" style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:'+((st.i+1)/Q.length*100)+'%;height:100%;background:#0a8f84"></div></div>'+
 '<h2 id="hd" tabindex="-1" style="margin:24px 0 16px;font-size:19px;font-weight:500;line-height:1.4">'+esc(q.q)+'</h2>'+
 '<div role="radiogroup" aria-labelledby="hd">'+opts+'</div>'+
 '<div role="group" aria-label="Jump to question" style="display:flex;gap:8px;margin:18px 0;flex-wrap:wrap">'+dots+'</div>'+
 (last&&u>0?'<p style="margin:0 0 12px;font-size:13px;color:var(--text-warning)"><i class="ti ti-alert-circle" style="margin-right:4px;vertical-align:-2px" aria-hidden="true"></i>You have '+u+' unanswered question'+(u>1?'s':'')+'.</p>':'')+
 '<div class="row"><button class="b" data-a="prev"'+(st.i===0?' style="visibility:hidden"':'')+'><i class="ti ti-arrow-left" style="margin-right:6px;vertical-align:-2px" aria-hidden="true"></i>Previous</button>'+
 (last?'<button class="b p" data-a="submit">Submit quiz</button>':'<button class="b p" data-a="next">Next<i class="ti ti-arrow-right" style="margin-left:6px;vertical-align:-2px" aria-hidden="true"></i></button>')+'</div>';
}
function results(){
 var x=st.quiz,score=st.result||{percent:0,correct:0,total:Q.length,passed:false,pass_percent:x.pass,late:false},ok=Boolean(score.passed),left=x.att<MAX;
 var badge=ok?'<span style="background:var(--bg-success);color:var(--text-success);padding:3px 12px;border-radius:8px;font-size:13px"><i class="ti ti-circle-check" style="margin-right:4px;vertical-align:-2px" aria-hidden="true"></i>Passed</span>':'<span style="background:var(--bg-warning);color:var(--text-warning);padding:3px 12px;border-radius:8px;font-size:13px"><i class="ti ti-alert-circle" style="margin-right:4px;vertical-align:-2px" aria-hidden="true"></i>'+(score.late?'Time is up':'Not passed')+'</span>';
 var retake='<button class="b'+(ok?'':' p')+'" data-a="retake">Retake quiz</button>';
 var back='<button type="button" class="b'+(ok?' p':'')+'" data-a="list"'+(ok?'':' style="border:0.5px solid var(--border-strong);background:transparent"')+'>Back to quizzes</button>';
 var btns=ok?back+(left?retake:''):(left?retake+back:back);
 var rev=(st.review||[]).map(function(item,i){
  var given=item.given==null||item.given<0?'Not answered':(item.choices[item.given]||'Not answered');
  return '<div class="rv"><div style="display:flex;gap:8px;align-items:flex-start"><i class="ti '+(item.right?'ti-circle-check':'ti-circle-x')+'" style="font-size:20px;margin-top:1px;color:'+(item.right?'var(--text-success)':'var(--text-danger)')+'" aria-hidden="true"></i><div><div style="font-size:14px;font-weight:500"><span class="sr-only">'+(item.right?'Correct. ':'Incorrect. ')+'</span>'+(i+1)+'. '+esc(item.prompt)+'</div>'+
  '<div style="font-size:13px;margin-top:4px;color:var(--text-secondary)">Your answer: '+esc(given)+'</div>'+
  (item.right?'':'<div style="font-size:13px;color:var(--text-success)">Correct answer: '+esc(item.choices[item.correct_index]||'')+'</div>')+
  (item.explanation?'<div style="font-size:13px;margin-top:4px;color:var(--text-secondary)">'+esc(item.explanation)+'</div>':'')+'</div></div></div>';
 }).join("");
 return '<div class="card" style="text-align:center"><h2 id="hd" tabindex="-1" style="margin:0 0 4px;font-size:16px;font-weight:500">'+esc(x.subject)+' results</h2>'+
 '<div style="font-size:44px;font-weight:500;line-height:1.2">'+score.percent+'%</div>'+
 '<div style="font-size:14px;color:var(--text-secondary);margin:2px 0 10px">'+score.correct+' of '+score.total+' correct, pass mark '+score.pass_percent+'%</div>'+badge+
 '<div style="font-size:13px;color:var(--text-secondary);margin:10px 0 16px">Attempt '+x.att+' of '+MAX+(ok||left?'':'. No attempts left, ask your instructor for help.')+'</div>'+
 '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+btns+'</div></div>'+
 '<div class="card" style="margin-top:14px;padding:6px 20px 10px"><div style="font-size:16px;font-weight:500;padding:14px 0 10px">Review your answers</div>'+rev+'</div>';
}
function draw(focus){
 root.innerHTML=st.s==="list"?list():st.s==="intro"?intro():st.s==="q"?question():results();
 var el=document.querySelector(focus||"#hd");if(el)el.focus();
}
function load(){
 root.innerHTML='<p style="color:var(--text-secondary)">Loading quizzes…</p>';
 var current=api();
 if(!current){catalog([]);draw();return;}
 current.rpc("sync_scheduled_unlocks").then(function(){return current.rpc("student_open_quizzes");},function(){return current.rpc("student_open_quizzes");}).then(function(result){
  if(!result||result.error){root.innerHTML='<div class="card">'+esc(result&&result.error?result.error.message:"Quizzes could not be loaded.")+'</div>';return;}
  catalog(result.data||[]);
  st.s="list";
  draw();
 });
}
root.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
 if(a==="open")open(b.dataset.id);
 else if(a==="list")toList();
 else if(a==="start"||a==="retake")begin();
 else if(a==="next"){st.i++;draw();}
 else if(a==="prev"){st.i--;draw();}
 else if(a==="go"){st.i=+b.dataset.n;draw();}
 else if(a==="submit")submit();
});
root.addEventListener("change",function(e){
 if(e.target.type==="radio"){st.a[st.i]=+e.target.value;draw("#body input:checked");}
});
if(window.BryllaAuth)BryllaAuth.ready.then(load);else load();
})();
</script>
</body>
</html>
