		<!-- Main CSS -->
		<link rel="stylesheet" href="assets/css/style.css">
		<style>
			body.forgot-password-page {
				--brylla-navy: #073b70;
				--brylla-navy-deep: #062b52;
				--brylla-teal: #13b8ad;
				--brylla-orange: #f28a3c;
				font-family: "Raleway", "Segoe UI", Arial, sans-serif;
				font-size: 14px;
			}
			.forgot-password-page h1, .forgot-password-page h2, .forgot-password-page h3 { font-family: "Raleway", "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: -.035em; }
			.forgot-password-page .login-content .login-bg { background: linear-gradient(145deg, var(--brylla-navy-deep), var(--brylla-navy) 68%, #07547f); }
			.forgot-password-page .login-content .login-carousel .login-carousel-section .login-banner {
				width: 190px;
				height: 190px;
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				border: 1px solid rgba(255,255,255,.45);
				border-radius: 50%;
				background: #fff;
				box-shadow: 0 18px 50px rgba(0,0,0,.16);
			}
			.forgot-password-page .login-content .login-banner img { width: 350px; max-width: none; height: 350px; object-fit: contain; }
			.forgot-password-page .login-content .mentor-course h3 { color: #fff; font-size: 30px; line-height: 1.25; }
			.forgot-password-page .login-content .mentor-course h3 span { color: var(--brylla-teal) !important; }
			.forgot-password-page .login-content .login-carousel p { color: rgba(255,255,255,.8); font-size: 15px; line-height: 1.7; }
			.forgot-password-page .login-content .slick-dots button { background: rgba(255,255,255,.45); }
			.forgot-password-page .login-content .slick-dots .slick-active button { background: var(--brylla-teal); }
			.forgot-password-page .login-content .login-wrap-bg { background: #fff; margin: 0 auto; }
			.forgot-password-page .login-content .login-wrap-bg .login-header { margin-bottom: 46px; }
			.forgot-password-page .forgot-brand-window { width: 175px; height: 94px; position: relative; display: block; overflow: hidden; }
			.forgot-password-page .forgot-brand-window img { position: absolute; top: 50%; left: 50%; width: 300px; max-width: none; height: 300px; transform: translate(-50%, -50%); }
			.forgot-password-page .login-header .link-1,
			.forgot-password-page .login-header .link-1:hover { color: var(--brylla-navy); text-decoration-color: var(--brylla-teal); }
			.forgot-password-page .login-content .topic { margin-bottom: 28px; color: var(--brylla-navy-deep); }
			.forgot-password-page .form-label { color: var(--brylla-navy-deep); font-weight: 600; }
			.forgot-password-page .login-content .login-wrap-bg .form-control:focus { border-color: var(--brylla-teal); box-shadow: 0 0 0 .2rem rgba(19,184,173,.14); }
			.forgot-password-page .link-2, .forgot-password-page .link-2:hover { color: var(--brylla-navy); }
			.forgot-password-page .btn.btn-secondary { background: var(--brylla-navy); border-color: var(--brylla-navy); color: #fff; font-family: inherit; font-weight: 700; }
			.forgot-password-page .btn.btn-secondary:hover, .forgot-password-page .btn.btn-secondary:focus { background: var(--brylla-navy-deep); border-color: var(--brylla-navy-deep); color: #fff; }
			@media (max-width: 991.98px) {
				.forgot-password-page .forgot-brand-window { width: 150px; }
				.forgot-password-page .forgot-brand-window img { width: 285px; height: 285px; }
			}
		</style>
	</head>
	<body class="forgot-password-page">

		<!-- Main Wrapper -->
		<div class="main-wrapper">
            <div class="login-content">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-xl-6 login-wrap-bg">
                        <!-- Login -->
                        <div class="login-wrapper">
                            <div class="loginbox">
                                <div class="w-100">
                                    <div class="d-flex align-items-center justify-content-between login-header">
                                        <a href="/" class="forgot-brand-window"><img src="assets/img/logo.png" alt="Brylla Academy"></a>
                                        <a href="/" class="link-1">Back to Home</a>
                                    </div>
                                    <div class="topic">
                                        <h1 class="fs-32 fw-bold mb-3">Forgot Password</h1>
                                        <p class="fs-14 fw-normal mb-0">Enter your email to reset your password.</p>
                                    </div>
                                    <form action="set-password" class="mb-3 pb-3" id="reset-form" novalidate>
                                        <div class="mb-3 position-relative">
                                            <label class="form-label" for="reset-email">Email<span class="text-danger ms-1">*</span></label>
                                            <div class="position-relative">
                                                <input type="email" id="reset-email" autocomplete="email" class="form-control form-control-lg" required>
                                                <span><i class="isax isax-sms input-icon text-gray-7 fs-14"></i></span>
                                            </div>
                                        </div>
                                        <p id="reset-status" class="mb-3" role="status"></p>
                                        <div class="d-grid">
                                            <button class="btn btn-secondary btn-lg" type="submit" id="reset-button">Submit<i class="isax isax-arrow-right-3 ms-1"></i></button>
                                        </div>
                                    </form>

                                    <p class="fs-14 fw-normal d-flex align-items-center justify-content-center">
                                        Remember Password?<a href="login" class="link-2 ms-1"> Sign In</a>
                                    </p>
    
                                    <!-- /Login -->
        
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
	   <!-- /Main Wrapper -->
	  
		<!-- jQuery -->
		<script src="assets/js/jquery-3.7.1.min.js"></script>
		
		<!-- Bootstrap Core JS -->
		<script src="assets/js/bootstrap.bundle.min.js"></script>
		
		<!-- Select2 JS -->
	  	<script src="assets/plugins/select2/js/select2.min.js"></script>

        <!-- Slick Slider -->
		<script src="assets/plugins/slick/slick.js"></script>
		
		<!-- Custom JS -->
		<script src="assets/js/script.js"></script>
		<script src="assets/js/brylla-public-config.js"></script>
		<script src="assets/js/brylla-checkout.js"></script>
		<script>
			(function () {
				var form = document.getElementById("reset-form");
				var input = document.getElementById("reset-email");
				var status = document.getElementById("reset-status");
				var button = document.getElementById("reset-button");
				form.addEventListener("submit", function (event) {
					event.preventDefault();
					status.className = "mb-3";
					if (!input.checkValidity() || !input.value.trim()) {
						status.className = "mb-3 text-danger";
						status.textContent = "Enter a valid email.";
						return;
					}
					button.disabled = true;
					status.textContent = "Sending…";
					window.BryllaCheckout.post("password-reset", { email: input.value.trim() }).then(function (result) {
						status.className = "mb-3 text-success";
						status.textContent = result.message;
					}).catch(function (error) {
						status.className = "mb-3 text-danger";
						status.textContent = error.message;
						button.disabled = false;
					});
				});
			})();
		</script>
	</body>
</html>
