<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My certificates | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { margin: 0; font-family: Raleway, "Segoe UI", Arial, sans-serif; background: #f4f8fb; color: #122d49; }
		main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
		.card { background: #fff; border: 1px solid #e3ebf2; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
		a { color: #073b70; }
	</style>
</head>
<body data-guard="student">
	<main>
		<p><a href="student-dashboard">Back to dashboard</a></p>
		<h1>My certificates</h1>
		<p>Issued certificates appear here. You cannot create or edit a certificate.</p>
		<div id="cert-list"><p>Loading…</p></div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="assets/js/brylla-public-config.js"></script>
	<script src="assets/js/brylla-auth.js"></script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			var host = document.getElementById("cert-list");
			var auth = window.BryllaAuth;
			if (!auth || !auth.ready) { host.innerHTML = "<p>Sign in to see certificates.</p>"; return; }
			auth.ready.then(function (state) {
				if (!state || !state.user) { location.assign("login?next=student-certificates"); return; }
				return auth.client.rpc("student_certificates").then(function (result) {
					if (result.error) { host.innerHTML = "<p>" + (result.error.message || "Certificates could not be loaded.") + "</p>"; return; }
					var rows = result.data || [];
					if (!rows.length) { host.innerHTML = "<p>No certificate has been issued yet.</p>"; return; }
					host.innerHTML = rows.map(function (row, index) {
						return '<article class="card" data-cert="' + index + '"><h2>' + row.course_title + '</h2><p>Issued to ' + row.display_name + ' on ' + row.issue_date + '</p><p>Certificate number: ' + row.certificate_number + '</p><p><a href="verify-certificate">Verify this certificate</a></p><p><button type="button" data-download="' + index + '">Download certificate</button></p></article>';
					}).join("");
					host.querySelectorAll("[data-download]").forEach(function (button) {
						button.addEventListener("click", function () {
							var row = rows[Number(button.getAttribute("data-download"))];
							if (!row) return;
							var canvas = document.createElement("canvas");
							var image = new Image();
							image.onload = function () {
								canvas.width = image.width;
								canvas.height = image.height;
								var ctx = canvas.getContext("2d");
								ctx.drawImage(image, 0, 0);
								var width = canvas.width;
								var height = canvas.height;
								ctx.textAlign = "center";
								ctx.fillStyle = "#f4f8fb";
								ctx.fillRect(width * 0.12, height * 0.50, width * 0.76, height * 0.08);
								ctx.fillRect(width * 0.12, height * 0.59, width * 0.76, height * 0.07);
								ctx.fillRect(width * 0.70, height * 0.73, width * 0.18, height * 0.05);
								ctx.fillStyle = "#13b8ad";
								ctx.font = "700 64px Raleway, Arial";
								ctx.fillText(row.display_name || "", width * 0.5, height * 0.555);
								ctx.fillStyle = "#122d49";
								ctx.font = "500 24px Raleway, Arial";
								ctx.fillText("for successfully completing the " + (row.course_title || "") + " Programme at Brylla Academy", width * 0.5, height * 0.635);
								ctx.font = "16px Raleway, Arial";
								ctx.fillText(row.issue_date || "", width * 0.795, height * 0.765);
								ctx.fillStyle = "#60748a";
								ctx.font = "14px Raleway, Arial";
								ctx.fillText(row.certificate_number || "", width * 0.5, height * 0.925);
								canvas.toBlob(function (blob) {
									if (!blob) return;
									var link = document.createElement("a");
									link.href = URL.createObjectURL(blob);
									link.download = (row.certificate_number || "certificate") + ".png";
									link.click();
									URL.revokeObjectURL(link.href);
								}, "image/png");
							};
							image.src = "assets/img/certificates/brylla-certificate.jpg";
						});
					});
				});
			});
		});
	</script>
</body>
</html>
