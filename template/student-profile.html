<!DOCTYPE html> 
<html lang="en">
	<head>
	<script src="assets/js/brylla-errors.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Update your Brylla Academy profile.">
	<meta name="theme-color" content="#073b70">
	<title>Profile | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link rel="apple-touch-icon" href="assets/img/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--color-primary: #073b70;
			--color-on-primary: #ffffff;
			--color-accent-text: #04635e;
			--color-banner: #073b70;
			--color-banner-muted: #d6e4f2;
			--color-text: #122d49;
			--color-muted: #60748a;
			--color-border: #e3ebf2;
			--color-page: #f4f8fb;
			--color-surface: #ffffff;
			--color-hover: #f4f8fb;
			--color-danger: #9a3412;
			--color-scrim: rgba(0, 0, 0, 0.35);
			--color-focus: #073b70;
			--font: Raleway, "Segoe UI", Arial, sans-serif;
			--radius-card: 12px;
			--radius-control: 8px;
			--radius-pill: 999px;
			--space-1: 4px;
			--space-2: 8px;
			--space-3: 12px;
			--space-4: 16px;
			--space-5: 24px;
			--header-height: 54px;
			--drawer-width: 240px;
			--motion: 200ms;
		}
		*, *::before, *::after { box-sizing: border-box; }
		html, body { margin: 0; }
		body { background: var(--color-page); color: var(--color-text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
		h1, h2, p { margin: 0; font-weight: 400; }
		a { color: inherit; }
		button, input, a { font-family: inherit; }
		:focus { outline: none; }
		:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
		.skip-link { position: absolute; left: 16px; top: 8px; z-index: 200; padding: 8px 12px; border-radius: 8px; background: #fff; color: var(--color-primary); font-weight: 500; text-decoration: none; transform: translateY(-140%); }
		.skip-link:focus { transform: none; }
		.site-header { position: sticky; top: 0; z-index: 100; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--color-border); }
		.header-start, .header-end { display: flex; align-items: center; gap: 8px; }
		.icon-button { width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--color-text); cursor: pointer; }
		.icon-button:hover { background: var(--color-hover); }
		.icon-button svg { width: 20px; height: 20px; }
		.icon-close { display: none; }
		.menu-toggle.is-open .icon-menu { display: none; }
		.menu-toggle.is-open .icon-close { display: block; }
		.brand { display: flex; align-items: center; text-decoration: none; }
		.brand-mark { position: relative; width: 84px; height: 44px; flex: 0 0 84px; overflow: hidden; display: block; }
		.brand-mark img { position: absolute; width: 107px; height: 107px; max-width: none; top: calc(50% + 4px); left: 50%; transform: translate(-50%, -50%); }
		.header-avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--color-banner-muted); color: var(--color-banner); font-size: 13px; font-weight: 500; text-decoration: none; }
		.scrim { position: fixed; z-index: 80; top: var(--header-height); right: 0; bottom: 0; left: 0; background: var(--color-scrim); opacity: 0; visibility: hidden; transition: opacity var(--motion) ease, visibility 0s linear var(--motion); }
		.scrim.is-open { opacity: 1; visibility: visible; transition: opacity var(--motion) ease; }
		.drawer { position: fixed; z-index: 90; top: var(--header-height); bottom: 0; left: 0; width: var(--drawer-width); padding: 8px; overflow: auto; background: #fff; border-right: 1px solid var(--color-border); opacity: 0; visibility: hidden; transform: translateX(-100%); transition: transform var(--motion) ease, opacity var(--motion) ease, visibility 0s linear var(--motion); }
		.drawer.is-open { opacity: 1; visibility: visible; transform: none; transition: transform var(--motion) ease, opacity var(--motion) ease; }
		.nav-label { margin: 12px 12px 4px; color: var(--color-muted); font-size: 12px; }
		.nav-group-account { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border); }
		.nav-list { margin: 0; padding: 0; list-style: none; }
		.nav-link { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; color: var(--color-text); text-decoration: none; }
		.nav-link svg { width: 18px; height: 18px; flex: 0 0 18px; }
		.nav-link:hover { background: var(--color-hover); }
		.nav-link[aria-current="page"] { color: var(--color-accent-text); font-weight: 500; }
		.nav-link.is-danger { color: var(--color-danger); }
		.page { width: min(720px, 100%); margin: 0 auto; padding: 16px; }
		.card { padding: 20px; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-card); }
		h1 { font-size: 20px; font-weight: 500; }
		.lede { margin-top: 4px; color: var(--color-muted); }
		form { display: grid; gap: 16px; margin-top: 20px; }
		label { display: grid; gap: 6px; font-weight: 500; }
		input { height: 44px; padding: 0 12px; border: 1px solid #c5d3e0; border-radius: 8px; color: var(--color-text); font-size: 14px; font-weight: 400; }
		.field-error { color: var(--color-danger); font-size: 13px; font-weight: 400; }
		.actions { display: flex; align-items: center; gap: 12px; }
		button[type="submit"] { height: 40px; padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: var(--color-primary); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
		button[type="submit"]:hover { background: #062b52; }
		.status { color: var(--color-accent-text); font-size: 14px; }
		.site-footer { padding: 35px 0; background: #041f3c; color: #d1e0ed; }
		.footer-wrap { width: min(1140px, calc(100% - 32px)); margin: 0 auto; }
		.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
		.footer-brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
		.footer-brand-mark { position: relative; display: block; width: 72px; height: 72px; flex: 0 0 72px; overflow: hidden; border: 1px solid rgba(7,59,112,.12); border-radius: 50%; background: #fff; }
		.footer-brand-mark img { position: absolute; top: calc(50% + 5px); left: 50%; width: 164px; height: 164px; max-width: none; transform: translate(-50%, -50%); }
		.footer-brand strong { display: block; color: #fff; font-size: 15px; font-weight: 500; }
		.footer-brand span { color: #aac0d3; font-size: 14px; }
		.footer-links { display: flex; flex-wrap: wrap; gap: 18px; }
		.footer-links a { color: #d1e0ed; font-size: 14px; text-decoration: none; }
		.footer-links a:hover { color: #13b8ad; }
		.copyright { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); color: #aac0d3; font-size: 14px; text-align: center; }
		.drawer-profile, .nav-mobile-only, .drawer-signout { display: none; }
		body.menu-lock { overflow: hidden; }
		@media (max-width: 767px) {
			.site-header { height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); }
			.site-header .icon-button { width: 44px; height: 44px; }
			.brand-mark { width: 64px; height: 36px; flex-basis: 64px; }
			.brand-mark img { width: 88px; height: 88px; }
			.scrim { top: calc(52px + env(safe-area-inset-top)); background: rgba(0, 0, 0, 0.4); }
			.drawer { top: calc(52px + env(safe-area-inset-top)); display: flex; flex-direction: column; width: min(80vw, 320px); padding: 0; }
			.drawer-profile { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--color-border); }
			.drawer-avatar { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 40px; border-radius: 50%; background: var(--color-banner-muted); color: var(--color-banner); font-weight: 500; text-decoration: none; }
			.drawer-name { font-weight: 500; }
			.drawer-email { color: var(--color-muted); font-size: 13px; }
			.drawer-scroll { flex: 1; overflow: auto; padding: 8px; }
			.drawer-signout { display: block; margin-top: auto; padding: 8px; border-top: 1px solid var(--color-border); }
			.nav-label { display: none; }
			.nav-mobile-only { display: list-item; }
			.nav-link { min-height: 44px; }
			.footer-inner { align-items: flex-start; flex-direction: column; }
		}
		@media (prefers-reduced-motion: reduce) {
			.drawer, .scrim { transition: none; }
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="assets/js/brylla-public-config.js"></script>
	<script src="assets/js/brylla-auth.js" data-guard="student"></script>
	<style>
		@media (min-width: 768px) {
			body:has(> .site-footer) { min-height: 100vh; display: flex; flex-direction: column; }
			body:has(> .site-footer) > .site-footer { margin-top: auto; }
		}
	</style>
	</head>
	<body>
	<a class="skip-link" href="#main">Skip to main content</a>
	<header class="site-header" id="site-header"></header>
	<div class="scrim" id="menu-scrim"></div>
	<nav class="drawer" id="dashboard-nav" aria-label="Dashboard" inert></nav>
	<main class="page" id="main">
		<section class="card">
			<h1>Profile</h1>
			<p class="lede">Update the name and email shown on your dashboard.</p>
			<form id="profile-form">
				<label>Full name
					<input id="profile-name" name="name" type="text" autocomplete="name" required maxlength="80">
				</label>
				<label>Email
					<input id="profile-email" name="email" type="email" autocomplete="email" required maxlength="120">
				</label>
				<p class="field-error" id="form-error" hidden></p>
				<div class="actions">
					<button type="submit">Save changes</button>
					<p class="status" id="form-status" role="status"></p>
				</div>
			</form>
		</section>
	</main>
	<footer class="site-footer">
		<div class="footer-wrap">
			<div class="footer-inner">
				<a class="footer-brand" href="index-4.html">
					<span class="footer-brand-mark"><img src="assets/img/logo.png" alt=""></span>
					<span><strong>Brylla Academy</strong><span>Practical professional skills taught for the remote world.</span></span>
				</a>
				<nav class="footer-links" aria-label="Footer navigation">
					<a href="/#courses">Courses</a>
					<a href="/#services">Professional Services</a>
					<a href="/#toolkit">Free Resource</a>
					<a href="contact-us">Contact Us</a>
					<a href="login.html">Student Login</a>
							</nav>
			</div>
			<p class="copyright">&copy; 2026 Brylla Academy. All rights reserved.</p>
		</div>
	</footer>
	<script src="assets/js/brylla-student.js"></script>
	<script src="assets/js/brylla-notifications.js"></script>
	<script>
		const fallback = { name: "", email: "" };
		const headerEl = document.getElementById("site-header");
		const navEl = document.getElementById("dashboard-nav");
		const scrimEl = document.getElementById("menu-scrim");
		const nameInput = document.getElementById("profile-name");
		const emailInput = document.getElementById("profile-email");
		const errorEl = document.getElementById("form-error");
		const statusEl = document.getElementById("form-status");
		const svgNs = "http://www.w3.org/2000/svg";
		const iconPaths = {
			menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
			close: '<path d="M6 6l12 12M18 6 6 18"/>',
			dashboard: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
			courses: '<path d="M4 6.5h10a3 3 0 0 1 3 3V19H7a3 3 0 0 0-3 3z"/><path d="M4 6.5A3 3 0 0 1 7 4h13v15"/>',
			calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
			assignments: '<rect x="6" y="3.5" width="12" height="17" rx="2"/><path d="M9 3.5h6v3H9zM9 12h6M9 16h4"/>',
			certificate: '<circle cx="12" cy="9" r="5"/><path d="M9 13.5 8 21l4-2 4 2-1-7.5"/>',
			payments: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
			settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.8l1.6 1.6M17.6 15.6l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.2l1.6-1.6M17.6 8.4l1.6-1.6"/>',
			help: '<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.7.3-1.2.9-1.2 1.6M12 17h.01"/>',
			bell: '<path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/>',
			signout: '<path d="M10 7V5H5v14h5v-2"/><path d="M10 12h9M16 8l4 4-4 4"/>'
		};
		const nav = [
			{ label: "Main", items: [{ label: "Dashboard", href: "student-dashboard.html", icon: "dashboard" }] },
			{ label: "Learning", items: [
				{ label: "My courses", href: "student-courses.html", icon: "courses" },
				{ label: "Quizes", href: "student-quiz.html", icon: "assignments" }
			] },
			{ label: "Account", items: [
				{ label: "Help", href: "index-4.html#faqs", icon: "help", mobileOnly: true },
				{ label: "Sign out", href: "index-4.html", icon: "signout", tone: "danger" }
			] }
		];
		let menuOpen = false;
		let student = loadProfile();

		function loadProfile() {
			const saved = window.BryllaStudent ? BryllaStudent.loadProfile() : null;
			return saved || { name: fallback.name, email: fallback.email };
		}
		function initials(name) {
			return name.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(function (part) { return part.charAt(0); }).join("").toUpperCase() || "ST";
		}
		function icon(name) {
			const svg = document.createElementNS(svgNs, "svg");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "1.75");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");
			svg.setAttribute("aria-hidden", "true");
			svg.innerHTML = iconPaths[name] || "";
			return svg;
		}
		function el(tag, className, text) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text != null) node.textContent = text;
			return node;
		}
		function fillForm() {
			nameInput.value = student.name;
			emailInput.value = student.email;
		}
		function renderHeader() {
			headerEl.replaceChildren();
			const start = el("div", "header-start");
			const toggle = el("button", "icon-button menu-toggle");
			toggle.type = "button";
			toggle.id = "menu-toggle";
			toggle.setAttribute("aria-expanded", menuOpen ? "true" : "false");
			toggle.setAttribute("aria-controls", "dashboard-nav");
			toggle.setAttribute("aria-label", menuOpen ? "Close menu" : "Open menu");
			if (menuOpen) toggle.classList.add("is-open");
			const menuIcon = icon("menu");
			menuIcon.classList.add("icon-menu");
			const closeIcon = icon("close");
			closeIcon.classList.add("icon-close");
			toggle.append(menuIcon, closeIcon);
			toggle.addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
			const brand = el("a", "brand");
			brand.href = "student-dashboard.html";
			brand.setAttribute("aria-label", "Brylla Academy home");
			const mark = el("span", "brand-mark");
			const logo = document.createElement("img");
			logo.src = "assets/img/logo.png";
			logo.alt = "";
			mark.append(logo);
			brand.append(mark);
			start.append(brand, toggle);
			const notify = el("a", "icon-button notify-button");
			notify.href = "student-notifications.html";
			notify.setAttribute("data-student-notifications", "");
			notify.setAttribute("aria-haspopup", "dialog");
			notify.setAttribute("aria-label", "Notifications");
			notify.append(icon("bell"));
			const avatar = el("a", "header-avatar", initials(student.name));
			avatar.href = "student-profile.html";
			avatar.setAttribute("aria-label", "Profile, " + student.name);
			avatar.setAttribute("aria-current", "page");
			const end = el("div", "header-end");
			end.append(notify, avatar);
			headerEl.append(start, end);
		}
		function renderNav() {
			navEl.replaceChildren();
			const profile = el("div", "drawer-profile");
			const drawerAvatar = el("a", "drawer-avatar", initials(student.name));
			drawerAvatar.href = "student-profile.html";
			drawerAvatar.setAttribute("aria-label", "Profile, " + student.name);
			profile.append(drawerAvatar);
			const copy = document.createElement("div");
			copy.append(el("p", "drawer-name", student.name), el("p", "drawer-email", student.email));
			profile.append(copy);
			const scroller = el("div", "drawer-scroll");
			const signout = el("div", "drawer-signout");
			nav.forEach(function (group) {
				const section = el("div", group.label === "Account" ? "nav-group nav-group-account" : "nav-group");
				section.append(el("p", "nav-label", group.label));
				const list = el("ul", "nav-list");
				group.items.forEach(function (item) {
					const li = document.createElement("li");
					if (item.mobileOnly) li.classList.add("nav-mobile-only");
					const link = el("a", "nav-link");
					link.href = item.href;
					if (item.current) link.setAttribute("aria-current", "page");
					if (item.tone === "danger") link.classList.add("is-danger");
					link.append(icon(item.icon), el("span", null, item.label));
					link.addEventListener("click", function () { closeMenu(false); });
					li.append(link);
					if (item.tone === "danger") signout.append(li);
					else list.append(li);
				});
				section.append(list);
				scroller.append(section);
			});
			navEl.append(profile, scroller, signout);
		}
		function focusable(container) {
			return Array.from(container.querySelectorAll("a[href], button:not([disabled])")).filter(function (node) {
				return node.getClientRects().length > 0;
			});
		}
		function openMenu() {
			menuOpen = true;
			navEl.inert = false;
			scrimEl.classList.add("is-open");
			navEl.classList.add("is-open");
			document.body.classList.add("menu-lock");
			const toggle = document.getElementById("menu-toggle");
			toggle.classList.add("is-open");
			toggle.setAttribute("aria-expanded", "true");
			toggle.setAttribute("aria-label", "Close menu");
			const first = focusable(navEl)[0];
			if (first) first.focus();
		}
		function closeMenu(restoreFocus) {
			if (!menuOpen) return;
			menuOpen = false;
			navEl.classList.remove("is-open");
			scrimEl.classList.remove("is-open");
			navEl.inert = true;
			document.body.classList.remove("menu-lock");
			const toggle = document.getElementById("menu-toggle");
			toggle.classList.remove("is-open");
			toggle.setAttribute("aria-expanded", "false");
			toggle.setAttribute("aria-label", "Open menu");
			if (restoreFocus !== false) toggle.focus();
		}
		scrimEl.addEventListener("click", function () { closeMenu(); });
		document.addEventListener("keydown", function (event) {
			if (event.key === "Escape" && menuOpen) closeMenu();
		});
		document.getElementById("profile-form").addEventListener("submit", function (event) {
			event.preventDefault();
			const name = nameInput.value.trim();
			const email = emailInput.value.trim();
			if (!name || !emailInput.checkValidity()) {
				errorEl.hidden = false;
				errorEl.textContent = "Enter your name and a valid email.";
				statusEl.textContent = "";
				return;
			}
			student = { name: name, email: email };
			if (window.BryllaStudent) BryllaStudent.saveProfile(student);
			errorEl.hidden = true;
			statusEl.textContent = "Saving…";
			renderHeader();
			renderNav();
			const saved = window.BryllaAuth ? BryllaAuth.saveName(name) : Promise.resolve({ ok: false });
			saved.then(function (result) {
				statusEl.textContent = result.ok ? "Saved. Your dashboard will show this name." : "Saved in this browser only. Your account could not be updated, so try again.";
			});
		});
		function showAccount() {
			student = loadProfile();
			emailInput.readOnly = true;
			emailInput.title = "Your sign-in email cannot be changed here.";
			fillForm();
			renderHeader();
			renderNav();
		}
		fillForm();
		renderHeader();
		renderNav();
		if (window.BryllaAuth) BryllaAuth.ready.then(showAccount);
	</script>
	</body>
</html>
