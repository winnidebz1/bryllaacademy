<!DOCTYPE html>
<html lang="en">
<head>
	<script src="assets/js/brylla-errors.js"></script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="See what to do next in your Brylla Academy course.">
	<meta name="theme-color" content="#073b70">
	<title>Student dashboard | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link rel="apple-touch-icon" href="assets/img/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--color-primary: #073b70;
			--color-on-primary: #ffffff;
			--color-accent: #13b8ad;
			--color-accent-text: #04635e;
			--color-banner: #073b70;
			--color-banner-text: #ffffff;
			--color-banner-muted: #d6e4f2;
			--color-success: #078d87;
			--color-success-strong: #04635e;
			--color-live-bg: #e7f6f5;
			--color-live-text: #04635e;
			--color-deadline-bg: #fff1e6;
			--color-deadline-text: #9a4e12;
			--color-page: #f4f8fb;
			--color-surface: #ffffff;
			--color-border: #e3ebf2;
			--color-text: #122d49;
			--color-muted: #4d5d6c;
			--color-danger: #b42318;
			--color-hover: #f4f8fb;
			--color-tint-purple: #e7eef6;
			--color-tint-coral: #e7f6f5;
			--color-tint-green: #e5f8f4;
			--color-warning-bg: #fff6ec;
			--color-warning-border: #f0d3b0;
			--color-warning-text: #7a4510;
			--color-scrim: rgba(0, 0, 0, 0.35);
			--color-focus: #073b70;
			--font: Raleway, "Segoe UI", Arial, sans-serif;
			--radius-card: 12px;
			--radius-control: 8px;
			--radius-pill: 999px;
			--space-1: 4px;
			--space-2: 8px;
			--space-3: 12px;
			--space-4: 16px;
			--space-5: 24px;
			--header-height: 54px;
			--block-gap: 14px;
			--drawer-width: 240px;
			--motion: 200ms;
		}

		*, *::before, *::after { box-sizing: border-box; }
		html, body { margin: 0; }
		body {
			background: var(--color-page);
			color: var(--color-text);
			font-family: var(--font);
			font-size: 14px;
			font-weight: 400;
			line-height: 1.5;
		}
		h1, h2, h3, p { margin: 0; font-weight: 400; }
		a { color: inherit; }
		button, a { font-family: inherit; }
		:focus { outline: none; }
		:focus-visible {
			outline: 2px solid var(--color-focus);
			outline-offset: 2px;
		}
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.skip-link {
			position: absolute;
			left: var(--space-4);
			top: var(--space-2);
			z-index: 200;
			padding: var(--space-2) var(--space-3);
			border-radius: var(--radius-control);
			background: var(--color-surface);
			color: var(--color-primary);
			font-weight: 500;
			text-decoration: none;
			transform: translateY(-140%);
		}
		.skip-link:focus { transform: none; }

		.site-header {
			position: sticky;
			top: 0;
			z-index: 100;
			height: var(--header-height);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 var(--space-4);
			background: var(--color-surface);
			border-bottom: 1px solid var(--color-border);
		}
		.header-start, .header-end {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			min-width: 0;
		}
		.icon-button {
			width: 40px;
			height: 40px;
			display: inline-grid;
			place-items: center;
			padding: 0;
			border: 0;
			border-radius: var(--radius-control);
			background: transparent;
			color: var(--color-text);
			text-decoration: none;
			cursor: pointer;
		}
		.icon-button:hover { background: var(--color-hover); }
		.icon-button svg { width: 20px; height: 20px; }
		.icon-close { display: none; }
		.menu-toggle.is-open .icon-menu { display: none; }
		.menu-toggle.is-open .icon-close { display: block; }
		.brand {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			min-width: 0;
			color: var(--color-text);
			text-decoration: none;
		}
		.brand-mark {
			position: relative;
			width: 84px;
			height: 44px;
			flex: 0 0 84px;
			overflow: hidden;
			display: block;
		}
		.brand-mark img {
			position: absolute;
			width: 107px;
			height: 107px;
			max-width: none;
			top: calc(50% + 4px);
			left: 50%;
			transform: translate(-50%, -50%);
		}
		.notify-button { position: relative; }
		.notify-badge {
			position: absolute;
			top: 4px;
			right: 2px;
			min-width: 16px;
			height: 16px;
			padding: 0 4px;
			border-radius: var(--radius-pill);
			background: var(--color-accent-text);
			color: #ffffff;
			font-size: 11px;
			font-weight: 500;
			line-height: 16px;
			text-align: center;
		}
		.header-avatar {
			width: 36px;
			height: 36px;
			display: grid;
			place-items: center;
			border-radius: 50%;
			background: var(--color-banner-muted);
			color: var(--color-banner);
			font-size: 13px;
			font-weight: 500;
			text-decoration: none;
		}

		.scrim {
			position: fixed;
			z-index: 80;
			top: var(--header-height);
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--color-scrim);
			opacity: 0;
			visibility: hidden;
			transition: opacity var(--motion) ease, visibility 0s linear var(--motion);
		}
		.scrim.is-open {
			opacity: 1;
			visibility: visible;
			transition: opacity var(--motion) ease, visibility 0s linear 0s;
		}
		.drawer {
			position: fixed;
			z-index: 90;
			top: var(--header-height);
			bottom: 0;
			left: 0;
			width: var(--drawer-width);
			padding: var(--space-2);
			overflow: auto;
			background: var(--color-surface);
			border-right: 1px solid var(--color-border);
			opacity: 0;
			visibility: hidden;
			transform: translateX(-100%);
			transition: transform var(--motion) ease, opacity var(--motion) ease, visibility 0s linear var(--motion);
		}
		.drawer.is-open {
			opacity: 1;
			visibility: visible;
			transform: translateX(0);
			transition: transform var(--motion) ease, opacity var(--motion) ease, visibility 0s linear 0s;
		}
		.nav-label {
			margin: var(--space-3) var(--space-3) var(--space-1);
			color: var(--color-muted);
			font-size: 12px;
			line-height: 1.3;
		}
		.nav-group-account {
			margin-top: var(--space-2);
			padding-top: var(--space-2);
			border-top: 1px solid var(--color-border);
		}
		.nav-list { margin: 0; padding: 0; list-style: none; }
		.nav-link {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			padding: 9px var(--space-3);
			border-radius: var(--radius-control);
			color: var(--color-text);
			font-size: 14px;
			font-weight: 400;
			line-height: 1.3;
			text-decoration: none;
		}
		.nav-link svg { width: 18px; height: 18px; flex: 0 0 18px; }
		.nav-link:hover { background: var(--color-hover); }
		.nav-link[aria-current="page"] {
			color: var(--color-accent-text);
			font-weight: 500;
		}
		.nav-link.is-danger { color: var(--color-danger); }
		.nav-badge {
			margin-left: auto;
			min-width: 18px;
			height: 18px;
			padding: 0 5px;
			display: inline-grid;
			place-items: center;
			border-radius: var(--radius-pill);
			background: var(--color-deadline-bg);
			color: var(--color-deadline-text);
			font-size: 12px;
			font-weight: 500;
		}

		.dashboard {
			display: flex;
			flex-direction: column;
			gap: var(--block-gap);
			width: min(1180px, calc(100% - 32px));
			margin: 0 auto;
			padding: var(--space-4) 0 var(--space-5);
		}
		.banner {
			position: relative;
			display: flex;
			align-items: center;
			gap: var(--space-4);
			overflow: hidden;
			padding: 20px 22px;
			border-radius: var(--radius-card);
			background: linear-gradient(145deg, #073b70 0%, #04635e 100%);
			color: var(--color-banner-text);
		}
		.banner::before, .banner::after {
			content: "";
			position: absolute;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.14);
			pointer-events: none;
		}
		.banner::before { width: 180px; height: 180px; top: -78px; right: -36px; }
		.banner::after { width: 120px; height: 120px; right: 96px; bottom: -68px; }
		.avatar-wrap { position: relative; width: 60px; height: 60px; flex: 0 0 60px; z-index: 1; }
		.banner-avatar {
			width: 60px;
			height: 60px;
			display: grid;
			place-items: center;
			border: 3px solid #ffffff;
			border-radius: 50%;
			background: var(--color-banner-muted);
			color: var(--color-banner);
			font-size: 18px;
			font-weight: 500;
		}
		.verified {
			position: absolute;
			right: -2px;
			bottom: -2px;
			width: 18px;
			height: 18px;
			display: grid;
			place-items: center;
			border: 2px solid #ffffff;
			border-radius: 50%;
			background: var(--color-success-strong);
			color: #ffffff;
		}
		.verified svg { width: 10px; height: 10px; }
		.banner-copy { position: relative; z-index: 1; min-width: 0; }
		.banner h1 { font-size: 20px; font-weight: 500; line-height: 1.3; }
		.banner-meta { margin-top: var(--space-1); color: var(--color-banner-muted); font-size: 14px; }

		.card {
			background: var(--color-surface);
			border: 1px solid var(--color-border);
			border-radius: var(--radius-card);
		}
		.continue-card, .payment-banner, .error-card {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--space-4);
			padding: var(--space-4);
		}
		.continue-card.is-welcome { flex-direction: column; align-items: stretch; }
		.welcome-stage {
			display: grid;
			place-items: center;
			min-height: 220px;
			margin-top: 12px;
			padding: 24px;
			border-radius: 12px;
			background: linear-gradient(145deg, #073b70 0%, #04635e 100%);
			color: #ffffff;
			text-align: center;
		}
		.welcome-stage strong { font-size: 18px; font-weight: 500; }
		.welcome-stage span { display: block; max-width: 36rem; margin-top: 8px; font-size: 14px; }
		.continue-card.is-welcome .btn-fill { align-self: flex-start; margin-top: 16px; }
		.continue-copy { min-width: 0; flex: 1; }
		.continue-actions { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
		.lesson-preview {
			position: relative;
			display: block;
			width: 128px;
			height: 72px;
			overflow: hidden;
			flex: 0 0 128px;
			border-radius: 10px;
			background: linear-gradient(145deg, #073b70 0%, #04635e 100%);
			color: #ffffff;
		}
		.lesson-preview-label {
			position: absolute;
			left: 8px;
			right: 8px;
			bottom: 6px;
			overflow: hidden;
			font-size: 11px;
			font-weight: 500;
			line-height: 1.2;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.lesson-preview-play {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 28px;
			height: 28px;
			display: grid;
			place-items: center;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			background: #ffffff;
			color: var(--color-primary);
		}
		.lesson-preview-play svg { width: 12px; height: 12px; margin-left: 1px; }
		.lesson-player { width: min(100%, 480px); aspect-ratio: 16 / 9; margin-top: 16px; overflow: hidden; border-radius: 12px; background: #041f3c; }
		.lesson-player video, .lesson-player iframe { display: block; width: 100%; height: 100%; border: 0; background: #041f3c; }
		.module-assignments { display: grid; gap: 12px; }
		.module-assignments h2 { margin: 0; font-size: 18px; font-weight: 500; }
		.module-assignments article { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--color-border); }
		.module-assignments p { margin: 0; }
		.module-assignments .event-detail { color: var(--color-muted); font-size: 13px; }
		.lesson-player strong, .lesson-player span { display: block; padding: 0 16px; color: #fff; }
		.lesson-player strong { padding-top: 18%; font-size: 16px; font-weight: 500; }
		.lesson-player span { margin-top: 6px; font-size: 13px; }
		.continue-title { font-size: 16px; font-weight: 500; line-height: 1.4; }
		.continue-meta { margin-top: var(--space-1); color: var(--color-muted); font-size: 14px; }
		.title-row { display: flex; align-items: center; gap: var(--space-2); }
		.title-row svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--color-success-strong); }
		.btn-fill, .btn-outline {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex: 0 0 auto;
			border-radius: var(--radius-pill);
			font-family: inherit;
			font-size: 14px;
			font-weight: 500;
			line-height: 1;
			text-decoration: none;
			cursor: pointer;
		}
		.btn-fill {
			height: 40px;
			padding: 0 var(--space-4);
			border: 0;
			background: var(--color-primary);
			color: var(--color-on-primary);
		}
		.btn-fill:hover { background: #062b52; }
		.btn-fill:focus-visible { outline-color: #1c2430; outline-offset: 3px; }
		.btn-outline {
			height: 32px;
			padding: 0 var(--space-3);
			border: 1px solid #8b9aab;
			background: var(--color-surface);
			color: var(--color-text);
			font-size: 13px;
		}
		.btn-outline:hover { background: var(--color-hover); }

		.payment-banner {
			border-color: var(--color-warning-border);
			background: var(--color-warning-bg);
			color: var(--color-warning-text);
		}
		.payment-copy { display: flex; align-items: flex-start; gap: var(--space-2); min-width: 0; }
		.payment-copy svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; }
		.payment-banner .btn-outline {
			border-color: #8a6a28;
			background: transparent;
			color: var(--color-warning-text);
		}

		.stat-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: var(--block-gap);
		}
		.stat-card {
			display: flex;
			align-items: center;
			gap: var(--space-3);
			padding: var(--space-4);
		}
		.stat-icon {
			width: 44px;
			height: 44px;
			display: grid;
			place-items: center;
			flex: 0 0 44px;
			border-radius: var(--radius-control);
		}
		.stat-icon svg { width: 22px; height: 22px; }
		.tint-purple { background: var(--color-tint-purple); color: var(--color-primary); }
		.tint-coral { background: var(--color-tint-coral); color: var(--color-accent-text); }
		.tint-green { background: var(--color-tint-green); color: var(--color-success-strong); }
		.stat-label { color: var(--color-muted); font-size: 13px; }
		.stat-value { margin-top: 2px; font-size: 22px; font-weight: 500; line-height: 1.2; }

		.upcoming h2 { margin-bottom: var(--space-2); font-size: 16px; font-weight: 500; }
		.event-row {
			display: flex;
			align-items: center;
			gap: var(--space-3);
			padding: var(--space-3) var(--space-4);
		}
		.event-row + .event-row { border-top: 1px solid var(--color-border); }
		.date-block {
			width: 40px;
			height: 40px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			flex: 0 0 40px;
			border-radius: var(--radius-control);
			line-height: 1.05;
		}
		.date-weekday { font-size: 10px; font-weight: 500; }
		.date-day { font-size: 14px; font-weight: 500; }
		.date-live { background: var(--color-live-bg); color: var(--color-live-text); }
		.date-deadline { background: var(--color-deadline-bg); color: var(--color-deadline-text); }
		.event-copy { min-width: 0; flex: 1; }
		.event-title { font-size: 14px; font-weight: 500; }
		.event-detail { margin-top: 2px; color: var(--color-muted); font-size: 13px; }
		.empty-note { padding: var(--space-4); color: var(--color-muted); }

		.error-card p { font-size: 14px; }

		.dash-block { display: grid; gap: 12px; }
		.dash-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
		.dash-head h2 { font-size: 18px; font-weight: 500; }
		.dash-link { color: var(--color-accent-text); font-size: 14px; font-weight: 500; text-decoration: none; }
		.dash-link:hover { text-decoration: underline; }
		.overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
		.learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
		.learn-card {
			display: flex;
			flex-direction: column;
			min-width: 0;
			overflow: hidden;
			background: var(--color-surface);
			border: 1px solid var(--color-border);
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(7, 59, 112, 0.06);
		}
		.learn-cover {
			display: grid;
			place-items: end start;
			aspect-ratio: 16 / 9;
			padding: 14px;
			background: linear-gradient(145deg, #073b70 0%, #04635e 100%);
			color: #fff;
			text-decoration: none;
		}
		.learn-card:nth-child(3n) .learn-cover { background: linear-gradient(145deg, #0c4a86 0%, #13b8ad 100%); }
		.learn-card:nth-child(3n + 2) .learn-cover { background: linear-gradient(160deg, #062b52 0%, #078d87 100%); }
		.learn-mark { font-size: 28px; font-weight: 500; line-height: 1; }
		.learn-body { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 14px 14px 16px; }
		.learn-title { font-size: 16px; font-weight: 500; line-height: 1.35; }
		.learn-title a { color: inherit; text-decoration: none; }
		.learn-title a:hover { color: var(--color-accent-text); }
		.learn-summary, .learn-meta, .learn-status { color: var(--color-muted); font-size: 13px; }
		.learn-summary { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
		.learn-status { color: var(--color-text); font-weight: 500; }
		.learn-price { font-size: 15px; font-weight: 500; }
		.learn-progress { display: grid; gap: 6px; }
		.learn-progress .progress-labels { display: flex; }
		.learn-progress .progress-track { display: block; }
		.learn-body .btn-fill { align-self: flex-start; margin-top: auto; min-height: 40px; }
		.empty-enrol {
			display: grid;
			gap: 8px;
			padding: 18px;
		}
		.empty-enrol h2 { font-size: 18px; font-weight: 500; }
		.empty-enrol p { color: var(--color-muted); }
		.activity-card { overflow: hidden; }
		.activity-row { display: block; padding: 12px 16px; color: inherit; text-decoration: none; }
		.activity-row + .activity-row { border-top: 1px solid var(--color-border); }
		.activity-row:hover { background: var(--color-hover); }
		.sk-card { height: 280px; }

		.sk {
			background: #e6edf5;
			border-radius: var(--radius-control);
		}
		.sk-banner { background: #d5e2f4; }
		.sk-avatar { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
		.sk-line { height: 12px; width: 220px; max-width: 100%; border-radius: var(--radius-pill); background: #e6edf5; }
		.sk-line + .sk-line { margin-top: var(--space-2); }
		.sk-line-short { width: 140px; }
		.banner .sk-line { background: rgba(255, 255, 255, 0.35); }
		.sk-pill { width: 132px; height: 40px; border-radius: var(--radius-pill); background: #e6edf5; }
		.sk-block { height: 76px; }
		@keyframes pulse {

	<script>
		const dashboard = JSON.parse(document.getElementById("dashboard-data").textContent);
		const headerEl = document.getElementById("site-header");
		const navEl = document.getElementById("dashboard-nav");
		const mainEl = document.getElementById("main");
		const scrimEl = document.getElementById("menu-scrim");
		let menuOpen = false;
		let runtimeState = null;
		let unlockedWeeks = {};
		let unlocksLoaded = false;
		let introVideoUrl = "";
		let lessonVideoUrl = "";
		let lessonLengthSeconds = 0;
		let playingTitle = "";
		let playingItemId = "";
		let postedAssignments = [];
		let submittedWeeks = {};
		let catalog = { status: "loading", enrolled: [], available: [], activity: [], error: "" };

		const svgNs = "http://www.w3.org/2000/svg";
		const iconPaths = {
			school: '<path d="M3 10 12 5l9 5-9 5-9-5z"/><path d="M7 12.2V16c0 .8 2.1 2.5 5 2.5s5-1.7 5-2.5v-3.8"/>',
			menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
			close: '<path d="M6 6l12 12M18 6 6 18"/>',
			bell: '<path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/>',
			check: '<path d="M5 12.5 9.2 17 19 7"/>',
			play: '<path fill="currentColor" stroke="none" d="M8 5.5v13l11-6.5z"/>',
			dashboard: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
			courses: '<path d="M4 6.5h10a3 3 0 0 1 3 3V19H7a3 3 0 0 0-3 3z"/><path d="M4 6.5A3 3 0 0 1 7 4h13v15"/>',
			calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
			assignments: '<rect x="6" y="3.5" width="12" height="17" rx="2"/><path d="M9 3.5h6v3H9zM9 12h6M9 16h4"/>',
			certificate: '<circle cx="12" cy="9" r="5"/><path d="M9 13.5 8 21l4-2 4 2-1-7.5"/>',
			payments: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
			settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.8l1.6 1.6M17.6 15.6l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.2l1.6-1.6M17.6 8.4l1.6-1.6"/>',
			signout: '<path d="M10 7V5H5v14h5v-2"/><path d="M10 12h9M16 8l4 4-4 4"/>',
			help: '<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.7.3-1.2.9-1.2 1.6M12 17h.01"/>',
			lessons: '<path d="M8 6h11M8 12h11M8 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
			warning: '<path d="M12 4.5 21 19H3L12 4.5z"/><path d="M12 10v4M12 17h.01"/>'
		};

		function icon(name) {
			const svg = document.createElementNS(svgNs, "svg");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "1.75");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");
			svg.setAttribute("aria-hidden", "true");
			svg.innerHTML = iconPaths[name] || "";
			return svg;
		}

		function el(tag, className, text) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text != null) node.textContent = text;
			return node;
		}

		function formatGhanaDate(isoDate) {
			const date = new Date(isoDate + "T12:00:00");
			const weekday = new Intl.DateTimeFormat("en-GB", { weekday: "short" }).format(date);
			const month = new Intl.DateTimeFormat("en-GB", { month: "short" }).format(date);
			return { label: weekday + " " + date.getDate() + " " + month, weekday: weekday, day: String(date.getDate()) };
		}

		function notificationLabel(count) {
			if (!count) return "Notifications, no unread";
			const noun = count === 1 ? "notification" : "notifications";
			return "Notifications, " + count + " unread " + noun;
		}

		function badgeText(count) {
			return count > 99 ? "99+" : String(count);
		}

		function readStored(key) {
			try {
				const raw = localStorage.getItem(key);
				return raw ? JSON.parse(raw) : null;
			} catch (error) {
				return null;
			}
		}

		function initialsFrom(name) {
			const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
			return parts.slice(0, 2).map(function (part) { return part.charAt(0); }).join("").toUpperCase() || "ST";
		}

		function applyProfile(data) {
			const profile = readStored("brylla-student-profile");
			if (!profile || !profile.name) return;
			data.student.name = profile.name;
			if (profile.email) data.student.email = profile.email;
			data.student.initials = initialsFrom(profile.name);
		}

		function applyLiveProgress(data) {
			const progress = window.BryllaStudent ? BryllaStudent.summary() : null;
			const started = Boolean(progress && progress.started);
			if (!started) {
				data.course.weekCurrent = 0;
				data.course.weeksTotal = 0;
				if (data.stats) {
					data.stats.lessonsDone = 0;
					data.stats.lessonsTotal = 0;
					data.stats.assignmentsDue = 0;
					data.stats.attendancePercent = 0;
				}
			if (data.lesson) {
				data.lesson.minutesLeft = 0;
				if (progress && unlockedWeeks[progress.weekCurrent]) data.lesson.title = progress.lessonTitle;
			}
			return;
		}
			data.course.weekCurrent = progress.weekCurrent;
			data.course.weeksTotal = progress.weeksTotal;
			if (data.stats) {
				data.stats.lessonsDone = progress.lessonsDone;
				data.stats.lessonsTotal = progress.lessonsTotal;
				data.stats.assignmentsDue = progress.assignmentsDue;
				data.stats.attendancePercent = progress.attendancePercent;
			}
			if (data.lesson) {
				data.lesson.minutesLeft = progress.minutesLeft;
				data.lesson.title = progress.lessonTitle;
				data.lesson.itemId = progress.lessonId;
				data.lesson.percentComplete = progress.percentComplete;
			}
			if (progress.completed) data.state = "completed";
		}

		function viewModel() {
			const data = JSON.parse(JSON.stringify(dashboard));
			applyProfile(data);
			const preview = runtimeState || new URLSearchParams(location.search).get("state");
			if (preview === "payment") data.payment.outstanding = true;
			else if (preview === "empty") data.upcoming = [];
			else if (preview === "new" || preview === "completed" || preview === "loading" || preview === "error") data.state = preview;
			if (data.state !== "completed") applyLiveProgress(data);
			if (data.state === "new" && data.stats) data.stats.assignmentsDue = 0;
			if (data.state === "completed") {
				data.course.weekCurrent = data.course.catalogWeeks;
				data.course.weeksTotal = data.course.catalogWeeks;
				if (data.stats) {
					data.stats.lessonsDone = data.stats.catalogLessons;
					data.stats.lessonsTotal = data.stats.catalogLessons;
					data.stats.assignmentsDue = 0;
				}
			}
			if (data.stats && data.lesson) {
				const total = data.stats.lessonsTotal;
				data.lesson.percentComplete = total ? Math.round((data.stats.lessonsDone / total) * 100) : 0;
			}
			const progress = window.BryllaStudent ? BryllaStudent.summary() : null;
			const lessonWeek = progress && progress.started ? progress.weekCurrent : 1;
			data.welcomeOnly = data.state !== "completed" && (!unlocksLoaded || !unlockedWeeks[lessonWeek]);
			if (data.welcomeOnly) {
				data.state = "new";
				data.upcoming = [];
				data.lesson.title = "Welcome to Brylla Academy";
				data.course.weekCurrent = 0;
				data.course.weeksTotal = 0;
			} else if (progress && data.lesson) {
				data.lesson.itemId = playingItemId || progress.lessonId;
				data.lesson.title = playingTitle || progress.lessonTitle;
				if (lessonLengthSeconds) data.lesson.minutesLeft = lessonLengthSeconds;
			}
			data.upcoming = (data.upcoming || []).filter(function (event) { return event.type !== "assignment"; });
			if (data.stats) data.stats.assignmentsDue = visibleAssignments().filter(function (row) { return !submittedWeeks[String(row.module_week)]; }).length;
			return data;
		}
		function visibleAssignments() {
			return postedAssignments.filter(function (row) { return unlockedWeeks[String(row.module_week)]; });
		}

		function focusable(container) {
			return Array.from(container.querySelectorAll("a[href], button:not([disabled])")).filter(function (node) {
				return node.getClientRects().length > 0;
			});
		}

		function renderHeader(data) {
			headerEl.replaceChildren();
			const start = el("div", "header-start");
			const toggle = el("button", "icon-button menu-toggle");
			toggle.type = "button";
			toggle.id = "menu-toggle";
			toggle.setAttribute("aria-expanded", menuOpen ? "true" : "false");
			toggle.setAttribute("aria-controls", "dashboard-nav");
			toggle.setAttribute("aria-label", menuOpen ? "Close menu" : "Open menu");
			if (menuOpen) toggle.classList.add("is-open");
			const menuIcon = icon("menu");
			menuIcon.classList.add("icon-menu");
			const closeIcon = icon("close");
			closeIcon.classList.add("icon-close");
			toggle.append(menuIcon, closeIcon);
			toggle.addEventListener("click", function () {
				if (menuOpen) closeMenu();
				else openMenu();
			});

			const brand = el("a", "brand");
			brand.href = "student-dashboard.html";
			brand.setAttribute("aria-label", data.academyName + " home");
			const mark = el("span", "brand-mark");
			const logo = document.createElement("img");
			logo.src = "assets/img/logo.png";
			logo.alt = "";
			mark.append(logo);
			brand.append(mark);
			start.append(brand, toggle);

			const end = el("div", "header-end");
			const unread = data.notifications.unread;
			const notify = el("a", "icon-button notify-button");
			notify.href = data.notifications.url;
			notify.setAttribute("data-student-notifications", "");
			notify.setAttribute("aria-haspopup", "dialog");
			notify.setAttribute("aria-label", notificationLabel(unread));
			notify.append(icon("bell"));
			if (unread > 0) notify.append(el("span", "notify-badge", badgeText(unread)));
			const avatar = el("a", "header-avatar", data.student.initials);
			avatar.href = "student-profile.html";
			avatar.setAttribute("aria-label", "Profile, " + data.student.name);
			end.append(notify, avatar);
			headerEl.append(start, end);
		}

		function renderNav(data) {
			navEl.replaceChildren();

		function mountPlayer(container, url) {
			container.replaceChildren();
			if (!url) {
				container.append(el("strong", null, "Lesson video"), el("span", null, "This lesson's video will play here when it is added under the module."));
				return;
			}
			const value = String(url);
			const youtube = value.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i);
			const vimeo = value.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
			const driveFile = value.match(/drive\.google\.com\/file\/d\/([\w-]+)/i);
			const driveQuery = value.match(/[?&]id=([\w-]+)/i);
			const driveId = driveFile ? driveFile[1] : (driveQuery && /drive\.google\.com/i.test(value) ? driveQuery[1] : "");
			if (youtube || vimeo || driveId) {
				const frame = document.createElement("iframe");
				frame.title = "Lesson video";
				frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
				frame.allowFullscreen = true;
				frame.src = driveId
					? "https://drive.google.com/file/d/" + encodeURIComponent(driveId) + "/preview"
					: youtube
						? "https://www.youtube.com/embed/" + encodeURIComponent(youtube[1]) + "?rel=0"
						: "https://player.vimeo.com/video/" + vimeo[1];
				container.append(frame);
				return;
			}
			if (!/\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(value) && !/\/object\/sign\//i.test(value)) {
				const frame = document.createElement("iframe");
				frame.title = "Lesson video";
				frame.allow = "autoplay; fullscreen";
				frame.allowFullscreen = true;
				frame.src = value;
				container.append(frame);
				return;
			}
			const video = document.createElement("video");
			video.controls = true;
			video.playsInline = true;
			video.preload = "metadata";
			video.addEventListener("loadedmetadata", function () {
				const seconds = Math.round(video.duration);
				if (!seconds || !isFinite(seconds)) return;
				lessonLengthSeconds = seconds;
				const label = document.querySelector(".continue-minutes");
				if (label) label.textContent = formatLength(seconds);
				else if (container.parentElement) {
					const note = el("p", "continue-minutes", formatLength(seconds));
					container.insertAdjacentElement("afterend", note);
				}
			});
			video.src = url;
			container.append(video);
		}
		function formatLength(seconds) {
			const total = Math.round(Number(seconds) || 0);
			if (!total || !isFinite(total)) return "";
			const hours = Math.floor(total / 3600);
			const minutes = Math.floor((total % 3600) / 60);
			const secs = total % 60;
			const pad = function (value) { return (value < 10 ? "0" : "") + value; };
			if (hours) return hours + ":" + pad(minutes) + ":" + pad(secs);
			return minutes + ":" + pad(secs);
		}
		function fileVideo(url) {
			return /\/object\/sign\//i.test(url || "") || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(url || "");
		}
		function signedMedia(files) {
			const client = window.BryllaAuth && BryllaAuth.client;
			const ready = (files || []).filter(function (file) { return file.storage_path; });
			const empty = { byModule: {}, loose: [], urls: {} };
			if (!client || !ready.length) return Promise.resolve(empty);
			return client.storage.from("course-media").createSignedUrls(ready.map(function (file) { return file.storage_path; }), 60 * 60).then(function (signed) {
				const urls = {};
				(signed.data || []).forEach(function (row, index) {
					const address = row && (row.signedUrl || row.signedURL);
					if (address && ready[index]) urls[ready[index].id] = address;
				});
				const byModule = {};
				const loose = [];
				files.forEach(function (file) {
					if (file.module_id) {
						if (!byModule[file.module_id]) byModule[file.module_id] = [];
						byModule[file.module_id].push(file);
					} else loose.push(file);
				});
				return { byModule: byModule, loose: loose, urls: urls };
			}).catch(function () { return empty; });
		}
		function lessonForModule(module) {
			const name = String(module.title || "").trim().toLowerCase();
			const liveName = name.indexOf("live session:") === 0 ? name.slice("live session:".length).trim() : "";
			let found = null;
			if (window.BryllaStudent) {
				BryllaStudent.lessons.forEach(function (lesson) {
					if (lesson.title.toLowerCase() === name) found = lesson;
				});
				if (!found && liveName) {
					BryllaStudent.lives.forEach(function (lesson) {
						if (lesson.title.toLowerCase() === liveName) found = lesson;
					});
				}
			}
			return found;
		}
		function videoForLesson(title, modules, links, media) {
			const key = String(title || "").trim().toLowerCase();
			let matched = null;
			(modules || []).forEach(function (module) {
				const name = String(module.title || "").trim().toLowerCase();
				if (name === key || name === "live session: " + key) matched = module;
			});
			if (matched) {
				const uploaded = (media.byModule[matched.id] || []).filter(function (file) { return file.kind === "video" && media.urls[file.id]; })[0];
				if (uploaded) return media.urls[uploaded.id];
				if (matched.video_url) return matched.video_url;
			}
			const link = (links || []).filter(function (item) { return String(item.title || "").trim().toLowerCase() === key; })[0];
			return link && link.video_url ? link.video_url : "";
		}
		function loadUnlocks() {
			const client = window.BryllaAuth && BryllaAuth.client;
			if (!client) {
				unlocksLoaded = true;

			}
			return client.rpc("sync_scheduled_unlocks").then(function () {

			}, function () {

			}).then(function (result) {
				unlockedWeeks = {};
				(result.data || []).forEach(function (row) { unlockedWeeks[String(row.module_key)] = true; });
				unlocksLoaded = true;
			}).catch(function () { unlocksLoaded = true; });
		}
		function loadAssignments() {
			const client = window.BryllaAuth && BryllaAuth.client;
			if (!client) return Promise.resolve();
			return client.auth.getSession().then(function (session) {
				const user = session.data.session && session.data.session.user;
				const submissions = user
					? client.from("assignment_submissions").select("module_week").eq("user_id", user.id).eq("course_id", "bookkeeping")
					: Promise.resolve({ data: [] });
				return Promise.all([
					client.from("course_assignments").select("module_week,kind,title,instructions,due_at,marks").eq("course_id", "bookkeeping").order("module_week"),
					submissions
				]).then(function (parts) {
					postedAssignments = parts[0].error ? [] : (parts[0].data || []);
					submittedWeeks = {};
					(parts[1].error ? [] : (parts[1].data || [])).forEach(function (row) { submittedWeeks[String(row.module_week)] = true; });
				});
			}).catch(function () {});
		}
		function loadLessonMedia() {
			const client = window.BryllaAuth && BryllaAuth.client;
			if (!client) return Promise.resolve();
			return Promise.all([
				client.from("courses").select("intro_video_url").eq("id", "bookkeeping").maybeSingle(),
				client.from("course_modules").select("id,title,video_url,duration_seconds,position").eq("course_id", "bookkeeping").order("position"),
				client.from("course_video_links").select("title,video_url").eq("course_id", "bookkeeping"),
				client.from("course_files").select("id,module_id,kind,storage_path").eq("course_id", "bookkeeping").eq("kind", "video").order("created_at")
			]).then(function (parts) {
				introVideoUrl = (parts[0].data && parts[0].data.intro_video_url) || "";
				const modules = parts[1].error ? [] : (parts[1].data || []);
				const links = parts[2].error ? [] : (parts[2].data || []);
				const files = parts[3].error ? [] : (parts[3].data || []);
				return signedMedia(files).then(function (media) {
					const progress = window.BryllaStudent ? BryllaStudent.summary() : null;
					const currentTitle = progress && progress.lessonTitle;
					lessonVideoUrl = videoForLesson(currentTitle, modules, links, media);
					playingTitle = currentTitle || "";
					playingItemId = progress && progress.lessonId || "";
					lessonLengthSeconds = 0;
					if (!fileVideo(lessonVideoUrl)) {
						modules.some(function (module) {
							const uploaded = (media.byModule[module.id] || []).filter(function (file) { return file.kind === "video" && media.urls[file.id]; })[0];
							if (!uploaded) return false;
							const lesson = lessonForModule(module);
							if (!lesson || !unlockedWeeks[String(lesson.week)]) return false;
							lessonVideoUrl = media.urls[uploaded.id];
							playingTitle = lesson.title;
							playingItemId = lesson.id;
							lessonLengthSeconds = module.duration_seconds || 0;
							return true;
						});
					} else {
						const matched = modules.filter(function (module) {
							const lesson = lessonForModule(module);
							return lesson && lesson.id === playingItemId;
						})[0];
						if (matched && matched.duration_seconds) lessonLengthSeconds = matched.duration_seconds;
					}
				});
			}).catch(function () {});
		}

		function clipText(value) {
			const text = String(value || "").replace(/\s+/g, " ").trim();
			if (text.length <= 160) return text;
			return text.slice(0, 157).trim() + "…";
		}
		function moneyLabel(amount, currency) {
			const number = Number(amount);
			if (!isFinite(number)) return "";
			const rounded = Math.round(number * 100) / 100;
			const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
			return (currency || "GHS") + " " + text;
		}
		function formatWhen(iso) {
			const date = new Date(iso);
			if (!iso || isNaN(date.getTime())) return "";
			return date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
		}
		function learningState(done, total) {
			if (total > 0 && done >= total) return { status: "Completed", action: "Review Course", showBar: true, percent: 100 };
			if (done > 0 && total > 0) return { status: "In Progress", action: "Continue Learning", showBar: true, percent: Math.round((done / total) * 100) };
			if (done > 0) return { status: "In Progress", action: "Continue Learning", showBar: false, percent: 0 };
			return { status: "Not Started", action: "Start Learning", showBar: false, percent: 0 };
		}
		function lessonName(courseId, itemId) {
			if (courseId !== "bookkeeping" || !window.BryllaStudent) return "";
			const lesson = BryllaStudent.lessonById(itemId);
			if (lesson) return lesson.title;
			const live = BryllaStudent.lives.filter(function (item) { return item.id === itemId; })[0];
			return live ? live.title : "";
		}
		function courseHref(course) {
			if (course.id === "bookkeeping" && course.lessonId) return "course-watch.html?item=" + encodeURIComponent(course.lessonId);
			if (course.id === "bookkeeping") return "course-watch.html";
			return "course-watch.html?course=" + encodeURIComponent(course.id);
		}
		function rememberCourse(map, course) {
			if (!course || !course.id) return;
			const current = map[course.id] || { id: course.id };
			map[course.id] = {
				id: course.id,
				title: course.title || current.title || "Course",
				summary: clipText(course.short_description || course.summary || course.description || current.summary || ""),
				price_amount: course.price_amount != null ? course.price_amount : current.price_amount,
				currency: course.currency || current.currency || "GHS"
			};
		}
		function asList(value) {
			if (Array.isArray(value)) return value;
			if (typeof value === "string") {
				try { const parsed = JSON.parse(value); return Array.isArray(parsed) ? parsed : []; } catch (error) { return []; }
			}
			return [];
		}
		function progressFor(courseId, rows, modules) {
			if (courseId === "bookkeeping" && window.BryllaStudent) {
				const summary = BryllaStudent.summary();
				const total = BryllaStudent.lessons.length;
				const done = summary.lessonsDone || 0;
				const state = learningState(done, total);
				return { state: state, lessonTitle: done ? summary.lessonTitle : "", lessonId: summary.lessonId || "" };
			}
			const seen = {};
			(rows || []).forEach(function (row) {
				if (row.course_id === courseId && row.kind !== "live" && row.item_id) seen[row.item_id] = true;
			});
			const total = (modules || []).filter(function (row) { return row.course_id === courseId; }).length;
			return { state: learningState(Object.keys(seen).length, total), lessonTitle: "", lessonId: "" };
		}
		function shapeCourse(record, owned, progress) {
			const state = progress.state;
			return {
				id: record.id,
				title: record.title || "Course",
				summary: record.summary || "",
				mark: String(record.title || "C").trim().charAt(0).toUpperCase() || "C",
				owned: owned,
				status: owned ? state.status : "Open now",
				action: owned ? state.action : "Click to enroll",
				showBar: Boolean(owned && state.showBar),
				percent: owned ? state.percent : 0,
				lessonTitle: owned ? progress.lessonTitle : "",
				lessonId: owned ? progress.lessonId : "",
				price: "",
				open: !owned,
				href: ""
			};
		}
		function loadCatalog() {
			const auth = window.BryllaAuth;
			if (!auth || !auth.client || !auth.ready) {
				catalog = { status: "error", enrolled: [], available: [], activity: [], error: "Your courses could not be loaded." };
				return Promise.resolve();
			}
			return auth.ready.then(function (state) {
				if (!state || !state.user) {
					catalog = { status: "ready", enrolled: [], available: [], activity: [] };
					return;
				}
				const client = auth.client;
				return Promise.all([
					client.from("enrollments").select("course_id,started_at,courses(id,title,short_description,description,price_amount,currency)").eq("user_id", state.user.id).eq("status", "active"),
					client.from("course_access").select("course_id,courses(id,title,short_description,description,price_amount,currency)").eq("user_id", state.user.id),
					client.from("courses").select("id,title,short_description,description,price_amount,currency").eq("status", "published").eq("visibility", "public").eq("approval_status", "approved"),
					client.rpc("public_open_courses"),
					client.rpc("public_course_listing", { p_course: "bookkeeping" }),
					client.from("lesson_progress").select("course_id,item_id,kind,completed_at").eq("user_id", state.user.id),
					client.from("notifications").select("type,title,message,created_at,destination_url").order("created_at", { ascending: false }).limit(6)
				]).then(function (parts) {
					if (parts[0].error || parts[1].error) throw parts[0].error || parts[1].error;
					const courses = {};
					(parts[2].error ? [] : parts[2].data || []).forEach(function (course) { rememberCourse(courses, course); });
					asList(parts[3].data).forEach(function (course) { rememberCourse(courses, course); });
					if (parts[4].data && parts[4].data.id) rememberCourse(courses, parts[4].data);
					const owned = {};
					(parts[0].data || []).forEach(function (row) {
						if (row.courses) rememberCourse(courses, row.courses);
						owned[row.course_id] = true;
					});
					(parts[1].data || []).forEach(function (row) {
						if (row.courses) rememberCourse(courses, row.courses);
					});
					const progressRows = parts[5].error ? [] : (parts[5].data || []);
					const notices = parts[6].error ? [] : (parts[6].data || []);
					const ownedIds = Object.keys(owned);
					const modulesPromise = ownedIds.length
						? client.from("course_modules").select("id,course_id,title").in("course_id", ownedIds)
						: Promise.resolve({ data: [] });
					return modulesPromise.then(function (modules) {
						const moduleRows = modules.error ? [] : (modules.data || []);
						const enrolled = ownedIds.filter(function (id) { return courses[id] || id; }).map(function (id) {
							const record = courses[id] || { id: id, title: "Course" };
							const shaped = shapeCourse(record, true, progressFor(id, progressRows, moduleRows));
							shaped.href = courseHref(shaped);
							return shaped;
						}).sort(function (a, b) { return a.title.localeCompare(b.title); });
						const available = Object.keys(courses).filter(function (id) { return !owned[id]; }).map(function (id) {
							const shaped = shapeCourse(courses[id], false, { state: learningState(0, 0), lessonTitle: "", lessonId: "" });
							shaped.href = courseHref(shaped);
							return shaped;
						}).sort(function (a, b) { return a.title.localeCompare(b.title); });
						const activity = [];
						progressRows.slice().sort(function (a, b) {
							return String(b.completed_at || "").localeCompare(String(a.completed_at || ""));
						}).forEach(function (row) {
							const title = lessonName(row.course_id, row.item_id);
							if (!title || activity.length >= 3) return;
							const when = formatWhen(row.completed_at);
							activity.push({
								title: title,
								detail: "Completed" + (when ? " " + when : ""),
								href: row.course_id === "bookkeeping" ? "course-watch.html?item=" + encodeURIComponent(row.item_id) : "course-watch.html?course=" + encodeURIComponent(row.course_id)
							});
						});
						notices.forEach(function (row) {
							if (row.type !== "announcement" && row.type !== "message") return;
							if (!row.title) return;
							const when = formatWhen(row.created_at);
							activity.push({
								title: row.title,
								detail: (row.type === "announcement" ? "Announcement" : "Message") + (when ? " · " + when : ""),
								href: row.destination_url || "student-notifications.html"
							});
						});
						catalog = { status: "ready", enrolled: enrolled, available: available, activity: activity, progressRows: progressRows };
					});
				});
			}).catch(function () {
				catalog = { status: "error", enrolled: [], available: [], activity: [], error: "Your courses could not be loaded." };
			});
		}
		function enrolOpen(course, button) {
			const auth = window.BryllaAuth;
			if (!auth || !auth.client) return;
			button.disabled = true;
			button.textContent = "Enrolling…";
			auth.client.rpc("enrol_open_course", { p_course: course.id }).then(function (result) {
				if (result.error) {
					button.disabled = false;
					button.textContent = "Click to enroll";
					let note = button.parentElement.querySelector(".enrol-error");
					if (!note) {
						note = el("p", "learn-meta enrol-error", "");
						button.before(note);
					}
					note.textContent = result.error.message || "The course could not be opened.";
					return;
				}
				if (course.id === "bookkeeping" && window.BryllaStudent) BryllaStudent.startCourse();
				location.assign(courseHref(course));
			}).catch(function () {
				button.disabled = false;
				button.textContent = "Click to enroll";
			});
		}
		function learnCard(course) {
			const article = el("article", "learn-card");
			const cover = course.open ? el("div", "learn-cover") : el("a", "learn-cover");
			if (!course.open) cover.href = course.href;
			cover.append(el("span", "learn-mark", course.mark));
			const body = el("div", "learn-body");
			const title = el("h3", "learn-title");
			if (course.open) title.textContent = course.title;
			else {
				const titleLink = el("a", null, course.title);
				titleLink.href = course.href;
				title.append(titleLink);
			}
			body.append(title);
			if (course.summary) body.append(el("p", "learn-summary", course.summary));
			if (course.lessonTitle && course.status === "In Progress") body.append(el("p", "learn-meta", "Current lesson: " + course.lessonTitle));
			if (course.status) body.append(el("p", "learn-status", course.status));
			if (course.showBar) {
				const progress = el("div", "learn-progress");
				const labels = el("div", "progress-labels");
				labels.append(el("span", null, "Progress"), el("strong", null, course.percent + "%"));
				const track = el("div", "progress-track");
				track.setAttribute("role", "progressbar");
				track.setAttribute("aria-label", course.title + " progress");
				track.setAttribute("aria-valuemin", "0");
				track.setAttribute("aria-valuemax", "100");
				track.setAttribute("aria-valuenow", String(course.percent));
				const fill = el("span");
				fill.style.width = course.percent + "%";
				track.append(fill);
				progress.append(labels, track);
				body.append(progress);
			}
			const button = course.open ? el("button", "btn-fill", course.action) : el("a", "btn-fill", course.action);
			if (course.open) {
				button.type = "button";
				button.addEventListener("click", function () { enrolOpen(course, button); });
			} else {
				button.href = course.href;
				if (course.id === "bookkeeping") {
					button.addEventListener("click", function () {
						if (window.BryllaStudent) BryllaStudent.startCourse();
					});
				}
			}
			body.append(button);
			article.append(cover, body);
			return article;
		}
		function sectionHead(title, linkHref, linkLabel) {
			const head = el("div", "dash-head");
			head.append(el("h2", null, title));
			if (linkHref) {
				const link = el("a", "dash-link", linkLabel);
				link.href = linkHref;
				head.append(link);
			}
			return head;
		}
		function renderOverview(courses) {
			const section = el("section", "dash-block");
			section.setAttribute("aria-label", "Learning overview");
			const completed = courses.filter(function (course) { return course.status === "Completed"; }).length;
			const active = courses.filter(function (course) { return course.status === "In Progress"; }).length;
			const grid = el("div", "overview-grid");
			[["Enrolled courses", String(courses.length)], ["In progress", String(active)], ["Completed courses", String(completed)]].forEach(function (item) {
				const card = el("article", "card stat-card");
				const copy = document.createElement("div");
				copy.append(el("p", "stat-label", item[0]), el("p", "stat-value", item[1]));
				card.append(copy);
				grid.append(card);
			});
			section.append(grid);
			return section;
		}
		function renderFeatured(courses) {
			const active = courses.filter(function (course) { return course.status !== "Completed"; }).sort(function (a, b) {
				const rank = function (course) { return course.status === "In Progress" ? 0 : 1; };
				return rank(a) - rank(b) || b.percent - a.percent;
			});
			if (!active.length) return null;
			const shown = active.slice(0, 3);
			const section = el("section", "dash-block");
			section.setAttribute("aria-labelledby", "continue-heading");
			const heading = sectionHead("Continue learning", active.length > 3 ? "student-courses.html" : "", "View all");
			heading.querySelector("h2").id = "continue-heading";
			const grid = el("div", "learn-grid");
			shown.forEach(function (course) { grid.append(learnCard(course)); });
			section.append(heading, grid);
			return section;
		}
		function renderEnrolled(courses) {
			const section = el("section", "dash-block");
			section.setAttribute("aria-labelledby", "enrolled-heading");
			const heading = sectionHead("My enrolled courses", "", "");
			heading.querySelector("h2").id = "enrolled-heading";
			const grid = el("div", "learn-grid");
			courses.forEach(function (course) { grid.append(learnCard(course)); });
			section.append(heading, grid);
			return section;
		}
		function renderExplore(courses) {
			const section = el("section", "dash-block");
			section.setAttribute("aria-labelledby", "explore-heading");
			const heading = sectionHead("Open now", "", "");
			heading.querySelector("h2").id = "explore-heading";
			const grid = el("div", "learn-grid");
			courses.forEach(function (course) { grid.append(learnCard(course)); });
			section.append(heading, grid);
			return section;
		}
		function renderEmptyEnrolment(hasCourses) {
			const section = el("section", "card empty-enrol");
			section.append(el("h2", null, "You have not enrolled in a course yet"));
			section.append(el("p", null, hasCourses
				? "The course that is open is below. Click to enroll, and your lessons will start."
				: "There are no courses open for enrolment right now."));
			return section;
		}
		function renderActivity(items) {
			const rows = (items || []).slice(0, 6);
			const hasBookkeeping = catalog.enrolled.some(function (course) { return course.id === "bookkeeping"; });
			if (hasBookkeeping) visibleAssignments().forEach(function (row) {
				if (submittedWeeks[String(row.module_week)]) return;
				const when = formatWhen(row.due_at);
				rows.push({
					title: row.title || ("Week " + row.module_week + " assignment"),
					detail: "Assignment" + (when ? " · Due " + when : ""),
					href: "course-watch.html?item=w" + row.module_week + "l1"
				});
			});
			if (!rows.length) return null;
			const section = el("section", "dash-block");
			section.setAttribute("aria-labelledby", "activity-heading");
			const heading = sectionHead("Recent learning", "", "");
			heading.querySelector("h2").id = "activity-heading";
			const card = el("div", "card activity-card");
			rows.slice(0, 6).forEach(function (item) {
				const link = el("a", "activity-row");
				link.href = item.href;
				link.append(el("h3", "event-title", item.title));
				if (item.detail) link.append(el("p", "event-detail", item.detail));
				card.append(link);
			});
			section.append(heading, card);
			return section;
		}
		function renderCatalogLoading() {
			mainEl.classList.add("is-loading");
			mainEl.setAttribute("aria-busy", "true");
			const status = el("p", "sr-only", "Loading your courses");
			status.setAttribute("role", "status");
			const banner = el("div", "banner sk-banner");
			banner.setAttribute("aria-hidden", "true");
			const lines = el("div");
			lines.append(el("div", "sk-line"), el("div", "sk-line sk-line-short"));
			banner.append(el("div", "sk-avatar"), lines);
			const grid = el("div", "learn-grid");
			grid.setAttribute("aria-hidden", "true");
			for (let i = 0; i < 3; i += 1) grid.append(el("div", "card sk sk-card"));
			mainEl.append(status, banner, grid);
		}
		function render() {
			const data = viewModel();
			renderHeader(data);
			renderNav(data);
			mainEl.classList.remove("is-loading");
			mainEl.removeAttribute("aria-busy");
			mainEl.replaceChildren();
			if (catalog.status === "loading") {
				renderCatalogLoading();
				return;
			}
			if (catalog.status === "error") {
				mainEl.append(renderBanner(data));
				renderError();
				return;
			}
			mainEl.append(renderBanner(data));
			if (!catalog.enrolled.length) mainEl.append(renderEmptyEnrolment(catalog.available.length > 0));
			else {
				mainEl.append(renderOverview(catalog.enrolled));
				const featured = renderFeatured(catalog.enrolled);
				if (featured) mainEl.append(featured);
				mainEl.append(renderEnrolled(catalog.enrolled));
			}
			if (catalog.available.length) mainEl.append(renderExplore(catalog.available));
			const activity = renderActivity(catalog.activity);
			if (activity && catalog.enrolled.length) mainEl.append(activity);
		}

		function openMenu() {
			menuOpen = true;
			navEl.inert = false;
			scrimEl.classList.add("is-open");
			navEl.classList.add("is-open");
			const toggle = document.getElementById("menu-toggle");
			toggle.classList.add("is-open");
			toggle.setAttribute("aria-expanded", "true");
			toggle.setAttribute("aria-label", "Close menu");
			mainEl.inert = true;
			document.body.classList.add("menu-lock");
			const footer = document.querySelector(".site-footer");
			if (footer) footer.inert = true;
			const first = focusable(navEl)[0];
			if (first) first.focus();
		}

		function closeMenu(restoreFocus) {
			if (!menuOpen) return;
			menuOpen = false;
			const toggle = document.getElementById("menu-toggle");
			navEl.classList.remove("is-open");
			scrimEl.classList.remove("is-open");
			navEl.inert = true;
			mainEl.inert = false;
			document.body.classList.remove("menu-lock");
			const footer = document.querySelector(".site-footer");
			if (footer) footer.inert = false;
			if (toggle) {
				toggle.classList.remove("is-open");
				toggle.setAttribute("aria-expanded", "false");
				toggle.setAttribute("aria-label", "Open menu");
				if (restoreFocus !== false) toggle.focus();
			}
		}

		scrimEl.addEventListener("click", function () { closeMenu(); });
		let swipeStart = 0;
		navEl.addEventListener("touchstart", function (event) {
			swipeStart = event.changedTouches[0].clientX;
		}, { passive: true });
		navEl.addEventListener("touchend", function (event) {
			if (swipeStart - event.changedTouches[0].clientX > 48) closeMenu();
		}, { passive: true });
		document.addEventListener("keydown", function (event) {
			if (!menuOpen) return;
			if (event.key === "Escape") {
				event.preventDefault();
				closeMenu();
				return;
			}
			if (event.key !== "Tab") return;
			const items = focusable(navEl);
			if (!items.length) return;
			const first = items[0];
			const last = items[items.length - 1];
			const toggle = document.getElementById("menu-toggle");
			const active = document.activeElement;
			if (active === toggle) {
				event.preventDefault();
				(event.shiftKey ? last : first).focus();
				return;
			}
			if (event.shiftKey && active === first) {
				event.preventDefault();
				last.focus();
			} else if (!event.shiftKey && active === last) {
				event.preventDefault();
				first.focus();
			}
		});
		document.addEventListener("focusin", function (event) {
			if (!menuOpen) return;
			const toggle = document.getElementById("menu-toggle");
			if (navEl.contains(event.target) || event.target === toggle) return;
			const first = focusable(navEl)[0];
			if (first) first.focus();
		});

		window.addEventListener("storage", function (event) {
			if (event.key === "brylla-course-progress" || event.key === "brylla-student-profile") startDashboard();
		});
		window.addEventListener("pageshow", function (event) {
			if (event.persisted && catalog.status === "ready") startDashboard();
		});
		function startDashboard() {
			Promise.all([loadUnlocks(), loadCatalog(), loadAssignments()]).then(render);
		}
		render();
		if (window.BryllaAuth) BryllaAuth.ready.then(startDashboard);
		else startDashboard();
	</script>
</body>
</html>
