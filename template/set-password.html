			body.set-password-page { font-family: "Raleway", "Segoe UI", Arial, sans-serif; font-size: 14px; }

			.set-password-page .login-content .login-wrap-bg .login-wrapper .loginbox { width: 100%; padding: 32px 24px; text-align: center; }
			.set-password-page .login-content .login-wrap-bg .login-header { flex-direction: column; justify-content: center !important; gap: 8px; margin-bottom: 24px; }

                                        <a href="/" class="link-1">Back to Home</a>
                                    </div>
                                    <div class="topic">
                                        <h1 class="fs-32 fw-bold ">Set Password</h1>
                                        <p class="fw-normal fs-14 mb-0">Your new password must be different from previous password</p>
                                    </div>
                                     <form class="mb-3 pb-3" id="set-password-form">

                                            <div class="position-relative" id="passwordInput">
                                                <input type="password" class="pass-inputs form-control form-control-lg" required minlength="6">
                                                <span class="isax toggle-passwords isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                            <div class="password-strength" id="passwordStrength">
                                                <span id="poor"></span>
                                                <span id="weak"></span>
                                                <span id="strong"></span>
                                                <span id="heavy"></span>
                                            </div>
                                            <div class="mt-2" id="passwordInfo"></div>	
                                        </div>
                                        <div class="mb-3 position-relative">
                                            <label class="form-label">Confirm Password <span class="text-danger"> *</span></label>
                                            <div class="position-relative">
                                                <input type="password" class="pass-inputa form-control" required minlength="6">
                                                <span class="isax toggle-passworda isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                        </div>
                                        <div class="d-grid">
                                            <button class="btn btn-secondary btn-lg" type="submit">Set Password & Continue <i class="isax isax-arrow-right-3 ms-1"></i></button>

		<!-- Custom JS -->
		<script src="assets/js/script.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="assets/js/brylla-public-config.js"></script>
		<script src="assets/js/brylla-checkout.js"></script>
		<script>
			(function () {
				var config = window.BryllaPublic || {};
				var client = config.client ? config.client() : null;
				var form = document.getElementById("set-password-form");
				var passInput = form.querySelector(".pass-inputs");
				var confirmInput = form.querySelector(".pass-inputa");
				var infoDiv = document.getElementById("passwordInfo");
				var submitBtn = form.querySelector("button[type='submit']");
				var signupEmail = sessionStorage.getItem("bryllaSignupEmail") || "";
				var signupToken = sessionStorage.getItem("bryllaSignupToken") || "";
				var signupMode = Boolean(signupEmail && signupToken);
				var linkError = new URLSearchParams(location.hash.slice(1)).get("error_description") || new URLSearchParams(location.search).get("error_description");

				function blockForm(message) {
					infoDiv.className = "mt-2 text-danger";
					infoDiv.innerHTML = message + ' <a href="forgot-password">Request a new link</a>.';
					submitBtn.disabled = true;
				}

				if (signupMode) {
					var heading = document.querySelector(".topic h1");
					var copy = document.querySelector(".topic p");
					if (heading) heading.textContent = "Choose a password";
					if (copy) copy.textContent = "Your email is confirmed. Choose the password you will use to sign in.";
					passInput.minLength = 8;
					confirmInput.minLength = 8;
				} else if (linkError) {
					blockForm("This link has expired or was already used.");
				} else if (client) {
					client.auth.getSession().then(function (result) {
						if (!result.data.session) blockForm("Open this page from the link in your email.");
					});
				}

				form.addEventListener("submit", async function (event) {
					event.preventDefault();
					var password = passInput.value;
					var confirm = confirmInput.value;
					infoDiv.textContent = "";

					if (password.length < (signupMode ? 8 : 6)) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = signupMode ? "Use a password of at least 8 characters." : "Password must be at least 6 characters long.";
						return;
					}
					if (password !== confirm) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = "Passwords do not match.";
						return;
					}
					if (signupMode) {
						if (!window.BryllaCheckout || !client) {
							infoDiv.className = "mt-2 text-danger";
							infoDiv.textContent = "Password setup is not available right now.";
							return;
						}
						submitBtn.disabled = true;
						submitBtn.textContent = "Saving password…";
						try {
							await window.BryllaCheckout.post("signup-code", {
								action: "complete",
								email: signupEmail,
								token: signupToken,
								password: password
							});
							var signedIn = await client.auth.signInWithPassword({ email: signupEmail, password: password });
							if (signedIn.error) throw signedIn.error;
							sessionStorage.removeItem("bryllaSignupToken");
							sessionStorage.setItem("brylla-role", "student");
							infoDiv.className = "mt-2 text-success";
							infoDiv.textContent = "Password saved. Opening your dashboard…";
							window.location.replace("student-dashboard");
						} catch (error) {
							infoDiv.className = "mt-2 text-danger";
							infoDiv.textContent = error.message || "The password could not be saved.";
							submitBtn.disabled = false;
							submitBtn.innerHTML = "Set Password & Continue <i class='isax isax-arrow-right-3 ms-1'></i>";
						}
						return;
					}
					if (!client) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = "Authentication service is not loaded.";
						return;
					}

					submitBtn.disabled = true;
					submitBtn.textContent = "Saving password…";

					try {
						var res = await client.auth.updateUser({ password: password });
						if (res.error) throw res.error;

						infoDiv.className = "mt-2 text-success";
						infoDiv.textContent = "Password saved. Taking you to sign in…";
						await client.auth.signOut();
						setTimeout(function () {
							window.location.replace("login?setup=done");
						}, 1200);
					} catch (err) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = err.message || "Failed to set password. Try requesting a new link.";
						submitBtn.disabled = false;
						submitBtn.innerHTML = "Set Password & Continue <i class='isax isax-arrow-right-3 ms-1'></i>";
					}
				});
			})();
		</script>
		
	</body>
