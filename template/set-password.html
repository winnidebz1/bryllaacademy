<!DOCTYPE html> 
<html lang="en">
	<head>
	
		<!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Dreams LMS is a powerful Learning Management System template designed for educators, training institutions, and businesses. Manage courses, track student progress, conduct virtual classes, and enhance e-learning experiences with an intuitive and feature-rich platform.">
		<meta name="keywords" content="LMS template, Learning Management System, e-learning software, online course platform, student management, education portal, virtual classroom, training management system, course tracking, online education">
		<meta name="author" content="Dreams Technologies">
		<meta name="robots" content="index, follow">
		
		<title>Brylla Academy</title>

		<!-- Favicon -->
		<link rel="shortcut icon" href="assets/img/favicon.png"> 
		<link rel="apple-touch-icon" href="assets/img/apple-icon.png">
        
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="assets/css/bootstrap.min.css">
		
		<!-- Fontawesome CSS -->
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

		<!-- Select2 CSS -->
		<link rel="stylesheet" href="assets/plugins/select2/css/select2.min.css">
		
        <!-- Slick CSS -->
		<link rel="stylesheet" href="assets/plugins/slick/slick.css">
		<link rel="stylesheet" href="assets/plugins/slick/slick-theme.css">
		
		<!-- Feathericon CSS -->
        <link rel="stylesheet" href="assets/plugins/feather/feather.css">

		<!-- Tabler Icon CSS -->
		<link rel="stylesheet" href="assets/plugins/tabler-icons/tabler-icons.css">

        <!-- Iconsax CSS -->
		<link rel="stylesheet" href="assets/css/iconsax.css">

		<!-- Main CSS -->
		<link rel="stylesheet" href="assets/css/style.css">
	
	</head>
	<body>

		<!-- Main Wrapper -->
		<div class="main-wrapper">
            <div class="login-content">
                <div class="row">
                    <div class="col-lg-6 login-wrap-bg">
                        <!-- Login -->
                        <div class="login-wrapper">
                            <div class="loginbox">
                                <div class="w-100">
                                    <div class="d-flex align-items-center justify-content-between login-header">
                                        <a href="/"><img src="assets/img/logo.png" alt="Brylla Academy" width="120"></a>
                                        <a href="/" class="link-1">Back to Home</a>
                                    </div>
                                    <div class="topic">
                                        <h1 class="fs-32 fw-bold ">Set Password</h1>
                                        <p class="fw-normal fs-14 mb-0">Your new password must be different from previous password</p>
                                    </div>
                                     <form class="mb-3 pb-3" id="set-password-form">
                                        <div class="mb-3 position-relative">
                                            <label class="form-label">New Password <span class="text-danger"> *</span></label>
                                            <div class="position-relative" id="passwordInput">
                                                <input type="password" class="pass-inputs form-control form-control-lg" required minlength="6">
                                                <span class="isax toggle-passwords isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                            <div class="password-strength" id="passwordStrength">
                                                <span id="poor"></span>
                                                <span id="weak"></span>
                                                <span id="strong"></span>
                                                <span id="heavy"></span>
                                            </div>
                                            <div class="mt-2" id="passwordInfo"></div>	
                                        </div>
                                        <div class="mb-3 position-relative">
                                            <label class="form-label">Confirm Password <span class="text-danger"> *</span></label>
                                            <div class="position-relative">
                                                <input type="password" class="pass-inputa form-control" required minlength="6">
                                                <span class="isax toggle-passworda isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                        </div>
                                        <div class="d-grid">
                                            <button class="btn btn-secondary btn-lg" type="submit">Set Password & Continue <i class="isax isax-arrow-right-3 ms-1"></i></button>
                                        </div>
                                    </form>
                                    <!-- /Login -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
	   <!-- /Main Wrapper -->
	  
		<!-- jQuery -->
		<script src="assets/js/jquery-3.7.1.min.js"></script>
		
		<!-- Bootstrap Core JS -->
		<script src="assets/js/bootstrap.bundle.min.js"></script>
		
		<!-- Select2 JS -->
	  	<script src="assets/plugins/select2/js/select2.min.js"></script>

        <!-- Slick Slider -->
		<script src="assets/plugins/slick/slick.js"></script>

        <!-- Validation-->
		<script src="assets/js/validation.js"></script>	
		
		<!-- Custom JS -->
		<script src="assets/js/script.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="assets/js/brylla-public-config.js"></script>
		<script>
			(function () {
				var config = window.BryllaPublic || {};
				var client = window.supabase && config.supabaseUrl ? window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey) : null;
				var form = document.getElementById("set-password-form");
				var passInput = form.querySelector(".pass-inputs");
				var confirmInput = form.querySelector(".pass-inputa");
				var infoDiv = document.getElementById("passwordInfo");
				var submitBtn = form.querySelector("button[type='submit']");
				var linkError = new URLSearchParams(location.hash.slice(1)).get("error_description") || new URLSearchParams(location.search).get("error_description");

				function blockForm(message) {
					infoDiv.className = "mt-2 text-danger";
					infoDiv.innerHTML = message + ' <a href="forgot-password">Request a new link</a>.';
					submitBtn.disabled = true;
				}

				if (linkError) {
					blockForm("This link has expired or was already used.");
				} else if (client) {
					client.auth.getSession().then(function (result) {
						if (!result.data.session) blockForm("Open this page from the link in your email.");
					});
				}

				form.addEventListener("submit", async function (event) {
					event.preventDefault();
					var password = passInput.value;
					var confirm = confirmInput.value;
					infoDiv.textContent = "";

					if (password.length < 6) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = "Password must be at least 6 characters long.";
						return;
					}
					if (password !== confirm) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = "Passwords do not match.";
						return;
					}
					if (!client) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = "Authentication service is not loaded.";
						return;
					}

					submitBtn.disabled = true;
					submitBtn.textContent = "Saving password…";

					try {
						var res = await client.auth.updateUser({ password: password });
						if (res.error) throw res.error;

						infoDiv.className = "mt-2 text-success";
						infoDiv.textContent = "Password saved. Taking you to sign in…";
						await client.auth.signOut();
						setTimeout(function () {
							window.location.replace("login?setup=done");
						}, 1200);
					} catch (err) {
						infoDiv.className = "mt-2 text-danger";
						infoDiv.textContent = err.message || "Failed to set password. Try requesting a new link.";
						submitBtn.disabled = false;
						submitBtn.innerHTML = "Set Password & Continue <i class='isax isax-arrow-right-3 ms-1'></i>";
					}
				});
			})();
		</script>
		
	</body>
</html>
