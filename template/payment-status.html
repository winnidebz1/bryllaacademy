<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Payment status | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; background: #f4f8fb; color: #122d49; }
		main { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
		.card { background: #fff; border: 1px solid #e3ebf2; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
		a { color: #073b70; }
		.btn { display: inline-block; background: #073b70; color: #ffffff !important; text-decoration: none; padding: 14px 28px; border-radius: 999px; font-weight: 600; margin-top: 18px; cursor: pointer; border: none; font-size: 15px; }
		.btn:hover { background: #062b52; }
		.btn-retry { background: #60748a; }
		.status-text { font-size: 17px; line-height: 1.5; margin: 20px 0; }
		.links { margin-top: 24px; font-size: 14px; color: #60748a; }
	</style>
</head>
<body>
	<main>
		<div class="card">
			<a href="/"><img src="assets/img/logo.png" alt="Brylla Academy" width="130"></a>
			<h1 style="margin-top: 20px; font-size: 24px;">Payment Status</h1>
			<div id="payment-status" class="status-text" role="status">Verifying your payment with Paystack…</div>
			<div class="links">
				<a href="checkout?course=bookkeeping">Back to checkout</a> · <a href="account-setup">Resend setup email</a>
			</div>
		</div>
	</main>
	<script src="assets/js/brylla-public-config.js"></script>
	<script src="assets/js/brylla-checkout.js"></script>
	<script>
		var params = new URLSearchParams(location.search);
		var reference = params.get("reference") || params.get("trxref") || "";
		var status = document.getElementById("payment-status");
		if (!reference) {
			status.innerHTML = "There is no payment reference found. The course is still locked.<br><a class='btn' href='checkout?course=bookkeeping'>Go to checkout</a>";
		} else if (!window.BryllaCheckout.configured()) {
			status.textContent = "Payment verification service is not connected yet. Please contact support.";
		} else {
			window.BryllaCheckout.post("verify-payment", { reference: reference }).then(function (result) {
				if (!result.ok) {
					status.innerHTML = "<strong>Payment status: " + (result.code || "pending") + "</strong><br>If you just completed payment, please wait a moment and retry.<br><button class='btn btn-retry' onclick='location.reload()'>Retry verification</button>";
					return;
				}
				var targetUrl = result.setupUrl || "set-password";
				status.innerHTML = "<strong>Payment confirmed!</strong><br><br>Redirecting you to choose your password…<br><a id='continue-link' class='btn' href='" + targetUrl + "'>Continue to set password &rarr;</a>";
				setTimeout(function () {
					window.location.assign(targetUrl);
				}, 1200);
			}).catch(function (error) {
				status.innerHTML = "<strong>Verification error:</strong> " + error.message + "<br><br><button class='btn btn-retry' onclick='location.reload()'>Retry verification</button>";
			});
		}
	</script>
</body>
</html>
