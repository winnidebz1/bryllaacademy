<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unsubscribe | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { margin: 0; font-family: Raleway, "Segoe UI", Arial, sans-serif; background: #f4f8fb; color: #122d49; }
		main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
		.card { background: #fff; border: 1px solid #e3ebf2; border-radius: 16px; padding: 32px 24px; }
		label { display: block; font-weight: 600; margin: 12px 0 6px; }
		input, button { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d5e0ea; font: inherit; }
		button { background: #073b70; color: #fff; border: 0; font-weight: 700; cursor: pointer; margin-top: 16px; }
	</style>
</head>
<body>
	<main>
		<div class="card">
			<h1>Unsubscribe from marketing</h1>
			<p>You can still download a free resource or join a waitlist. We will not add this email to marketing after you unsubscribe.</p>
			<form id="unsub-form">
				<label for="email">Email address</label>
				<input id="email" type="email" required>
				<button type="submit">Unsubscribe</button>
			</form>
			<p id="unsub-status" role="status"></p>
		</div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="assets/js/brylla-public-config.js"></script>
	<script>
		document.getElementById("unsub-form").addEventListener("submit", function (event) {
			event.preventDefault();
			var status = document.getElementById("unsub-status");
			var client = window.BryllaPublic && BryllaPublic.client ? BryllaPublic.client() : null;
			if (!client) { status.textContent = "Try again later."; return; }
			client.rpc("unsubscribe_contact", { p_email: document.getElementById("email").value }).then(function (result) {
				status.textContent = result.error ? (result.error.message || "The request failed.") : (result.data && result.data.message) || "Unsubscribed.";
			});
		});
	</script>
</body>
</html>
