<!DOCTYPE html> 
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Checkout | Brylla Academy</title>
	<link rel="icon" type="image/png" href="assets/img/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; background: #f4f8fb; color: #122d49; }
		main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
		img { width: 120px; }
		h1 { font-size: 1.6rem; }
		form, .summary { background: #fff; border: 1px solid #e3ebf2; border-radius: 16px; padding: 20px; }
		label { display: block; font-weight: 600; margin: 12px 0 6px; }
		input { width: 100%; box-sizing: border-box; border: 1px solid #e3ebf2; border-radius: 10px; padding: 12px; font: inherit; }
		button, .back { display: inline-block; margin-top: 16px; background: #073b70; color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; text-decoration: none; }
		button[disabled] { opacity: .6; }
		.price { font-size: 1.4rem; font-weight: 700; }
		[role="status"], [role="alert"] { margin-top: 12px; }
		.back { background: transparent; color: #073b70; padding-left: 0; }
	</style>
	</head>
	<body>
	<main>
		<a href="/"><img src="assets/img/logo.png" alt="Brylla Academy"></a>
		<h1>Checkout</h1>
		<p id="course-copy"></p>
		<div class="summary">
			<p id="course-title"></p>
			<p class="price" id="course-price"></p>
			<p>The amount charged is the price stored for this course. It is not taken from this page.</p>
		</div>
		<form id="checkout-form">
			<label for="checkout-name">Full name</label>
			<input id="checkout-name" name="name" autocomplete="name" required>
			<label for="checkout-email">Email</label>
			<input id="checkout-email" name="email" type="email" autocomplete="email" required>
			<button id="pay-button" type="submit">Continue to Paystack</button>
			<p id="checkout-status" role="status"></p>
		</form>
		<a class="back" href="/#courses">Back to courses</a>
	</main>
	<script src="assets/js/brylla-public-config.js"></script>
	<script src="assets/js/brylla-checkout.js"></script>
	<script>
		var catalog = {
			bookkeeping: { title: "Bookkeeping", price: "GHS 950", open: true }
		};
		var params = new URLSearchParams(location.search);
		var courseId = params.get("course") || "bookkeeping";
		var course = catalog[courseId];
		var status = document.getElementById("checkout-status");
		var form = document.getElementById("checkout-form");
		document.getElementById("checkout-name").value = sessionStorage.getItem("bryllaPendingName") || "";
		document.getElementById("checkout-email").value = sessionStorage.getItem("bryllaPendingEmail") || "";
		if (!course || !course.open) {
			document.getElementById("course-title").textContent = "This course is not open for payment.";
			document.getElementById("course-price").textContent = "";
			form.hidden = true;
		} else {
			document.getElementById("course-title").textContent = course.title;
			document.getElementById("course-price").textContent = course.price;
			document.getElementById("course-copy").textContent = "Pay first. You will choose a password only after the payment is verified.";
		}
		form.addEventListener("submit", function (event) {
			event.preventDefault();
			if (!form.reportValidity()) return;
			var button = document.getElementById("pay-button");
			button.disabled = true;
			status.textContent = "Starting checkout…";
			if (!window.BryllaCheckout.configured()) {
				status.textContent = "Payments are not connected yet. The course stays locked, and no account has been created.";
				button.disabled = false;
				return;
			}
			window.BryllaCheckout.post("create-checkout", {
				courseId: courseId,
				fullName: document.getElementById("checkout-name").value.trim(),
				email: document.getElementById("checkout-email").value.trim()
			}).then(function (result) {
				if (result.status === "already_paid") {
					status.textContent = result.message;
					button.disabled = false;
					return;
				}
				if (!result.authorizationUrl) throw new Error("Paystack did not return a payment page.");
				status.textContent = "Redirecting to Paystack…";
				location.assign(result.authorizationUrl);
			}).catch(function (error) {
				status.textContent = error.message;
				button.disabled = false;
			});
		});
	</script>
	</body>
</html>
