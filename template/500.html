<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#073b70">
	<title>Something went wrong | Brylla Academy</title>
	<link rel="icon" type="image/png" href="/assets/img/logo.png">
	<link rel="apple-touch-icon" href="/assets/img/logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<style>
		:root { --navy: #073b70; --navy-deep: #062b52; --teal: #13b8ad; --ink: #122d49; --muted: #60748a; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; color: var(--ink); background: linear-gradient(180deg, #f4f8fb 0%, #fff 55%); font-family: Raleway, "Segoe UI", Arial, sans-serif; text-align: center; }
		.card { width: min(520px, 100%); padding: 36px 28px; border: 1px solid #e3ebf2; border-radius: 18px; background: #fff; box-shadow: 0 18px 40px rgba(7,59,112,.08); }
		.brand { width: 92px; height: 92px; margin: 0 auto 8px; position: relative; overflow: hidden; border-radius: 50%; background: #fff; }
		.brand img { position: absolute; width: 180px; height: 180px; max-width: none; top: calc(50% + 6px); left: 50%; transform: translate(-50%, -50%); }
		p.code { margin: 0; color: var(--teal); font-weight: 800; letter-spacing: .08em; }
		h1 { margin: 8px 0 10px; color: var(--navy-deep); font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -.04em; }
		p { margin: 0 0 22px; color: var(--muted); }
		a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--navy); color: #fff; font-weight: 700; text-decoration: none; }
		a:hover { background: var(--navy-deep); }
	</style>
</head>
<body>
	<main class="card">
		<div class="brand"><img src="/assets/img/logo.png" alt="Brylla Academy"></div>
		<p class="code">500</p>
		<h1>Brylla Academy hit a problem</h1>
		<p>The page could not be loaded. Wait a moment and try again, or return home.</p>
		<a href="/">Back to Brylla Academy</a>
	</main>
</body>
</html>
