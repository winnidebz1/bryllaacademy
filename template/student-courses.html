			payments: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
			settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.8l1.6 1.6M17.6 15.6l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.2l1.6-1.6M17.6 8.4l1.6-1.6"/>',

		function icon(name) {
			const svg = document.createElementNS(svgNs, "svg");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("aria-hidden", "true");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "1.75");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");
			svg.innerHTML = iconPaths[name] || "";
			return svg;
		}
		function el(tag, className, text) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text != null) node.textContent = text;
			return node;
		}
		const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

			return date.getDate() + " " + months[date.getMonth()];
		}
		function formatWeekday(iso) {
			const date = new Date(iso + "T12:00:00");
			const weekday = new Intl.DateTimeFormat("en-GB", { weekday: "short" }).format(date);

		function rank(status) { return { in_progress: 0, upcoming: 1, unenrolled: 2, completed: 3 }[status]; }

			return data.courses.slice().sort(function (a, b) {
				if (rank(a.status) !== rank(b.status)) return rank(a.status) - rank(b.status);

			});
		}
		function matches(course) {
			if (filter === "all") return true;
			if (filter === "in_progress") return course.status === "in_progress";
			if (filter === "upcoming") return course.status === "upcoming";
			return course.status === "completed";
		}
		function primaryId(list) {
			const active = list.filter(function (course) { return course.status === "in_progress"; });
			active.sort(function (a, b) { return (b.lastOpened || "").localeCompare(a.lastOpened || ""); });
			if (active[0]) return active[0].id;
			const open = list.filter(function (course) { return course.status === "unenrolled" && course.id === "bookkeeping"; });
			return open[0] ? open[0].id : "";
		}

		function renderHeader() {
			headerEl.replaceChildren();
			const start = el("div", "header-start");
			const toggle = el("button", "icon-button menu-toggle");
			toggle.type = "button";
			toggle.id = "menu-toggle";
			toggle.setAttribute("aria-expanded", "false");
			toggle.setAttribute("aria-controls", "dashboard-nav");
			toggle.setAttribute("aria-label", "Open menu");
			const menuIcon = icon("menu");
			menuIcon.classList.add("icon-menu");
			const closeIcon = icon("close");
			closeIcon.classList.add("icon-close");
			toggle.append(menuIcon, closeIcon);
			toggle.addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
			const brand = el("a", "brand");
			brand.href = "student-dashboard.html";
			brand.setAttribute("aria-label", "Brylla Academy home");
			const mark = el("span", "brand-mark");
			const logo = document.createElement("img");
			logo.src = "assets/img/logo.png";
			logo.alt = "";
			mark.append(logo);
			brand.append(mark);
			start.append(brand, toggle);
			const end = el("div", "header-end");
			const notify = el("a", "icon-button notify-button");
			notify.href = "student-notifications.html";
			notify.setAttribute("data-student-notifications", "");
			notify.setAttribute("aria-haspopup", "dialog");
			notify.setAttribute("aria-label", data.notifications ? "Notifications, " + data.notifications + " unread" : "Notifications, no unread");
			notify.append(icon("bell"));
			if (data.notifications > 0) notify.append(el("span", "notify-badge", data.notifications > 99 ? "99+" : String(data.notifications)));
			const avatar = el("span", "header-avatar", data.student.initials);
			avatar.setAttribute("role", "img");
			avatar.setAttribute("aria-label", data.student.name);
			end.append(notify, avatar);
			headerEl.append(start, end);
		}
		function renderNav() {
			navEl.replaceChildren();
			const profile = el("div", "drawer-profile");
			profile.append(el("span", "drawer-avatar", data.student.initials));
			const copy = el("div");
			copy.append(el("p", "drawer-name", data.student.name), el("p", "drawer-email", data.student.email));
			profile.append(copy);
			const scroller = el("div", "drawer-scroll");
			const signout = el("div", "drawer-signout");
			nav.forEach(function (group) {
				const section = el("div", group.label === "Account" ? "nav-group nav-group-account" : "nav-group");
				section.append(el("p", "nav-label", group.label));
				const list = el("ul", "nav-list");
				group.items.forEach(function (item) {
					const li = document.createElement("li");
					if (item.mobileOnly) li.classList.add("nav-mobile-only");
					const link = el("a", "nav-link");
					link.href = item.href;
					if (item.current) link.setAttribute("aria-current", "page");
					if (item.tone === "danger") link.classList.add("is-danger");
					link.append(icon(item.icon), el("span", null, item.label));
					if (item.badge && data.assignmentsDue > 0) link.append(el("span", null, String(data.assignmentsDue)));
					link.addEventListener("click", function () { closeMenu(false); });
					li.append(link);
					if (item.tone === "danger") signout.append(li);
					else list.append(li);
				});
				if (list.children.length) { section.append(list); scroller.append(section); }
			});
			navEl.append(profile, scroller, signout);
		}
		function progressBar(course, label, value) {
			const wrap = el("div");
			const labels = el("div", "progress-labels");
			labels.append(el("span", null, label), el("span", null, value + "%"));
			const track = el("div", "progress-track");
			track.setAttribute("role", "progressbar");
			track.setAttribute("aria-label", course.title + " progress");
			track.setAttribute("aria-valuemin", "0");
			track.setAttribute("aria-valuemax", "100");
			track.setAttribute("aria-valuenow", String(value));
			const fill = el("span");
			fill.style.width = value + "%";
			track.append(fill);
			wrap.append(labels, track);
			return wrap;
		}
		function courseTone(course) {
			if (course.status === "in_progress") return "tone-progress";
			if (course.status === "completed") return "tone-done";
			return "tone-upcoming";
		}
		function renderCard(course, filledId) {
			const card = el("article", "course-card");
			const tone = courseTone(course);
			const top = el("div", "card-top");
			const tile = el("div", "tile " + tone);
			const glyph = document.createElement("i");
			glyph.className = "ti " + (course.icon || "ti-book");
			glyph.setAttribute("aria-hidden", "true");
			tile.append(glyph);
			const identity = document.createElement("div");
			const label = course.status === "upcoming" ? (course.startLabel || "Upcoming")
				: course.status === "completed" ? "Completed" : "In progress";
			identity.append(el("span", "badge " + tone, label), el("h2", null, course.title));
			top.append(tile, identity);
			card.append(top);
			if (course.status === "in_progress") {
				card.append(progressBar(course, "Week " + course.currentWeek + " of " + course.totalWeeks, course.progress));
				card.append(el("div", "note", "Next: " + course.nextLesson));
				const button = el("a", course.id === filledId ? "btn primary" : "btn", "Continue course");
				button.href = course.continueUrl;
				button.setAttribute("aria-label", "Continue " + course.title);
				card.append(button);
			} else if (course.status === "upcoming") {
				card.append(el("div", "note", "You are enrolled. Lessons unlock when the course starts."));
				const button = el("a", "btn", "View details");
				button.href = course.detailsUrl;
				button.setAttribute("aria-label", "View details for " + course.title);
				card.append(button);
			} else {
				card.append(progressBar(course, course.finished || "Finished", 100));
				card.append(el("div", "note"));
				const actions = el("div", "card-actions");
				const certificate = el("a", "btn");
				certificate.href = course.certificateUrl;
				certificate.setAttribute("aria-label", "View certificate for " + course.title);
				const mark = document.createElement("i");
				mark.className = "ti ti-certificate";
				mark.setAttribute("aria-hidden", "true");
				certificate.append(mark, document.createTextNode("Certificate"));
				const review = el("a", "btn", "Review");
				review.href = course.reviewUrl;
				review.setAttribute("aria-label", "Review " + course.title);
				actions.append(certificate, review);
				card.append(actions);
			}
			return card;
		}
		function renderCourses() {
			const section = el("section");
			section.setAttribute("aria-labelledby", "courses-title");
			const courses = sortedCourses();
			const head = el("div", "section-head");
			const titles = el("div");
			const heading = el("h1", null, "My courses");
			heading.id = "courses-title";
			const inProgress = courses.filter(function (course) { return course.status === "in_progress"; }).length;
			titles.append(heading, el("p", "section-sub", courses.length + " enrolled, " + inProgress + " in progress"));
			const browse = el("a", "text-link", "Browse all courses");
			browse.href = data.browseUrl;
			browse.append(icon("arrow"));
			head.append(titles, browse);
			section.append(head);
			const row = el("div", "filters");
			row.setAttribute("role", "group");
			row.setAttribute("aria-label", "Filter courses");
			[["all", "All"], ["in_progress", "In progress"], ["upcoming", "Upcoming"], ["completed", "Completed"]].forEach(function (item) {
				const count = item[0] === "all" ? courses.length : courses.filter(function (course) { return matchesFilter(course, item[0]); }).length;
				const button = el("button", "filter", item[1]);
				button.type = "button";
				button.append(el("span", "n", String(count)));
				button.setAttribute("aria-pressed", filter === item[0] ? "true" : "false");
				button.addEventListener("click", function () {
					filter = item[0];
					render();
					const selected = mainEl.querySelector('.filter[aria-pressed="true"]');
					if (selected) selected.focus();
				});
				row.append(button);
			});
			section.append(row);
			const filtered = courses.filter(matches);
			const live = el("p", "sr-only");
			live.setAttribute("aria-live", "polite");
			live.textContent = "Showing " + filtered.length + (filtered.length === 1 ? " course" : " courses");
			section.append(live);
			const list = el("ul", "course-grid");
			if (!filtered.length) {
				const message = filter === "completed" ? "No completed courses yet. Finish a course to see it here."
					: filter === "upcoming" ? "No upcoming courses."
					: filter === "all" ? "You haven't enrolled in a course yet."
					: "No courses in progress. Start a course to see it here.";
				const item = el("li", "filter-empty", message);
				list.append(item);
			} else {
				const filledId = primaryId(courses);
				filtered.forEach(function (course) {
					const item = el("li");
					item.append(renderCard(course, filledId));
					list.append(item);
				});
			}
			section.append(list);
			mainEl.append(section);
		}
		function matchesFilter(course, name) {
			if (name === "all") return true;
			if (name === "in_progress") return course.status === "in_progress";
			if (name === "upcoming") return course.status === "upcoming";
			return course.status === "completed";
		}
		function renderEmpty() {
			const panel = el("section", "empty-panel");
			panel.append(el("h2", null, "You haven't enrolled in a course yet"));
			panel.append(el("p", "course-meta", "Choose a short course and start when the lessons open."));
			const link = el("a", "btn primary", "Browse courses");
			link.href = data.browseUrl;
			panel.append(link);
			mainEl.append(panel);
		}
		function renderLoading() {
			mainEl.setAttribute("aria-busy", "true");
			const status = el("p", "sr-only", "Loading your courses");
			status.setAttribute("role", "status");
			const grid = el("div", "course-grid");
			grid.append(el("div", "sk sk-card"), el("div", "sk sk-card"));
			mainEl.append(status, grid);
		}
		function renderError() {
			const panel = el("section", "error-panel");
			panel.setAttribute("role", "alert");
			panel.append(el("p", null, "We couldn't load your courses."));
			const retry = el("button", "btn primary", "Try again");
			retry.type = "button";
			retry.addEventListener("click", function () {
				runtimeState = null;
				const url = new URL(location.href);
				url.searchParams.delete("state");
				history.replaceState(null, "", url.pathname + url.search);
				render();
			});
			panel.append(retry);
			mainEl.append(panel);
		}
		function applyBookkeepingProgress() {
			if (!window.BryllaStudent) return;
			data.courses = catalog.filter(function (item) { return BryllaStudent.courseRecord(item.id).enrolled; });
			const summary = BryllaStudent.summary();
			const profile = BryllaStudent.loadProfile();
			if (profile) {
				data.student.name = profile.name;
				data.student.email = profile.email;
				data.student.initials = profile.name.trim().split(/\s+/).slice(0, 2).map(function (part) { return part.charAt(0); }).join("").toUpperCase();
			}
			const course = data.courses.filter(function (item) { return item.id === "bookkeeping"; })[0];
			if (!course) return;
			if (!summary.started) {
				course.progress = 0;
				course.currentWeek = 0;
				course.totalWeeks = 0;
				course.nextLesson = "Week 1, " + summary.lessonTitle;
				course.status = "in_progress";
				return;
			}
			course.progress = summary.percentComplete;
			course.currentWeek = summary.weekCurrent;
			course.totalWeeks = summary.weeksTotal;
			course.nextLesson = "Week " + summary.weekCurrent + ", " + summary.lessonTitle;
			course.status = summary.completed ? "completed" : "in_progress";
			if (summary.completed) {
				course.finished = "Finished " + formatShort(new Date().toISOString().slice(0, 10)) + ", grade " + summary.percentComplete + "%";
				course.certificateUrl = "student-certificates.html";
				course.reviewUrl = "course-watch.html";
			}
		}
		function render() {
			applyBookkeepingProgress();
			renderHeader();
			renderNav();
			mainEl.removeAttribute("aria-busy");
			mainEl.replaceChildren();
			const state = pageState();
			if (state === "loading") return renderLoading();
			if (state === "error") return renderError();
			if (state === "empty" || !data.courses.length) return renderEmpty();
			renderCourses();
		}
		function focusable(container) {
			return Array.from(container.querySelectorAll("a[href], button:not([disabled])")).filter(function (node) { return node.getClientRects().length; });
		}
		function openMenu() {
			menuOpen = true;
			navEl.inert = false;
			scrimEl.classList.add("is-open");
			navEl.classList.add("is-open");
			document.body.classList.add("menu-lock");
			const toggle = document.getElementById("menu-toggle");
			toggle.classList.add("is-open");
			toggle.setAttribute("aria-expanded", "true");
			toggle.setAttribute("aria-label", "Close menu");
			const first = focusable(navEl)[0];
			if (first) first.focus();
		}
		function closeMenu(restore) {
			if (!menuOpen) return;
			menuOpen = false;
			navEl.classList.remove("is-open");
			scrimEl.classList.remove("is-open");
			navEl.inert = true;
			document.body.classList.remove("menu-lock");
			const toggle = document.getElementById("menu-toggle");
			toggle.classList.remove("is-open");
			toggle.setAttribute("aria-expanded", "false");
			toggle.setAttribute("aria-label", "Open menu");
			if (restore !== false) toggle.focus();
		}
		scrimEl.addEventListener("click", function () { closeMenu(); });
		document.addEventListener("keydown", function (event) {
			if (!menuOpen || event.key !== "Escape") return;
			event.preventDefault();
			closeMenu();
		});
		window.addEventListener("storage", function (event) {
			if (event.key === "brylla-course-progress" || event.key === "brylla-student-profile") render();
		});
		render();
		if (window.BryllaAuth) BryllaAuth.ready.then(render);
	</script>
	</body>
</html>
