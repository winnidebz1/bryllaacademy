<!DOCTYPE html> 
<html lang="en">
	<head>
	
		<!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Open the Brylla Academy email and choose your password.">
		<meta name="author" content="Brylla Academy">
		<meta name="robots" content="index, follow">
		
		<title>Check your email | Brylla Academy</title>

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="assets/img/logo.png">
		<link rel="apple-touch-icon" href="assets/img/logo.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="assets/css/bootstrap.min.css">
		
		<!-- Fontawesome CSS -->
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

		<!-- Select2 CSS -->
		<link rel="stylesheet" href="assets/plugins/select2/css/select2.min.css">
		
        <!-- Slick CSS -->
		<link rel="stylesheet" href="assets/plugins/slick/slick.css">
		<link rel="stylesheet" href="assets/plugins/slick/slick-theme.css">
		
		<!-- Feathericon CSS -->
        <link rel="stylesheet" href="assets/plugins/feather/feather.css">

		<!-- Tabler Icon CSS -->
		<link rel="stylesheet" href="assets/plugins/tabler-icons/tabler-icons.css">

        <!-- Iconsax CSS -->
		<link rel="stylesheet" href="assets/css/iconsax.css">

		<!-- Main CSS -->
		<link rel="stylesheet" href="assets/css/style.css">
		<style>
			body.otp-page {
				--brylla-navy: #073b70;
				--brylla-navy-deep: #062b52;
				--brylla-teal: #13b8ad;
				--brylla-orange: #f28a3c;
				font-family: "Raleway", "Segoe UI", Arial, sans-serif;
				font-size: 14px;
			}
			.otp-page h1, .otp-page h2, .otp-page h3 { font-family: "Raleway", "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: -.035em; }
			.otp-page .login-content .login-wrap-bg { background: #fff; }
			.otp-page .login-content .login-wrap-bg { position: relative; right: auto; width: 100%; max-width: 100%; flex: 0 0 100%; }
			.otp-page .login-content > .row { margin-right: 0; margin-left: 0; }
			.otp-page .login-content .login-wrap-bg .login-wrapper { max-width: 680px; margin: 0 auto; }
			.otp-page .login-content .login-wrap-bg .login-wrapper .loginbox { width: 100%; padding: 20px 40px; }
			.otp-page .login-content .login-wrap-bg .login-header { justify-content: center !important; margin-bottom: 24px; }
			.otp-page .otp-brand-window { width: 175px; height: 116px; position: relative; display: block; overflow: hidden; }
			.otp-page .otp-brand-window img { position: absolute; top: 50%; left: 50%; width: 280px; max-width: none; height: 280px; transform: translate(-50%, -50%); }
			.otp-page .login-content .topic { margin-bottom: 28px; color: var(--brylla-navy-deep); }
			.otp-page .form-label { color: var(--brylla-navy-deep); font-weight: 600; }
			.otp-page .login-content .login-wrap-bg .form-control:focus { border-color: var(--brylla-teal); box-shadow: 0 0 0 .2rem rgba(19,184,173,.14); }
			.otp-page .login-content .otp { color: var(--brylla-navy-deep); font-weight: 700; }
			.otp-page .link-2, .otp-page .link-2:hover { color: var(--brylla-navy); }
			.otp-page .btn.btn-secondary { background: var(--brylla-navy); border-color: var(--brylla-navy); color: #fff; font-family: inherit; font-weight: 700; }
			.otp-page .btn.btn-secondary:hover, .otp-page .btn.btn-secondary:focus { background: var(--brylla-navy-deep); border-color: var(--brylla-navy-deep); color: #fff; }
			@media (max-width: 991.98px) {
				.otp-page .login-content .login-wrap-bg .login-wrapper .loginbox { padding: 20px 30px; }
			}
		</style>
	</head>
	<body class="otp-page">

		<!-- Main Wrapper -->
		<div class="main-wrapper">
            <div class="login-content">
                <div class="row">
                    <div class="col-12 login-wrap-bg">
                        <!-- Login -->
                        <div class="login-wrapper">
                            <div class="loginbox">
                                <div class="w-100">
                                    <div class="d-flex align-items-center justify-content-between login-header">
                                        <span class="otp-brand-window"><img src="assets/img/logo.png" alt="Brylla Academy"></span>
                                    </div>
                                    <div class="topic">
                                        <h1 class="fs-32 fw-bold mb-3">Check your email</h1>
                                        <p class="fs-14 fw-normal mb-0">Registration email: <strong id="verification-email">the email used during signup</strong></p>
                                    </div>
                                    <p class="mb-3" id="otp-status" role="status">Open the email and click Choose a password. That page is where you create your password and finish registration.</p>

                                    <div class="fs-14 fw-normal d-flex align-items-center justify-content-center">
                                        Didn’t get the link? <button class="btn btn-link link-2 ms-1 p-0" type="button" id="resend-code">Send the link again</button>
                                    </div>
                                    <div class="text-center mt-3"><a href="register.html" class="link-2">Back to sign up</a></div>
    
                                    <!-- /Login -->
        
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
	   <!-- /Main Wrapper -->
	  
		<!-- jQuery -->
		<script src="assets/js/jquery-3.7.1.min.js"></script>
		
		<!-- Bootstrap Core JS -->
		<script src="assets/js/bootstrap.bundle.min.js"></script>
		
		<!-- Select2 JS -->
	  	<script src="assets/plugins/select2/js/select2.min.js"></script>

        <!-- Slick Slider -->
		<script src="assets/plugins/slick/slick.js"></script>
		
		<!-- Custom JS -->
		<script src="assets/js/script.js"></script>
		<script src="assets/js/brylla-public-config.js"></script>
		<script src="assets/js/brylla-checkout.js"></script>
		<script>
			(function () {
				var email = sessionStorage.getItem("bryllaSignupEmail") || "";
				var name = sessionStorage.getItem("bryllaSignupName") || "";
				var verificationEmail = document.getElementById("verification-email");
				var status = document.getElementById("otp-status");
				verificationEmail.textContent = email || "the email used during signup";
				if (!email) status.textContent = "Go back to sign up so we know where to send the link.";
				function show(message, failed) {
					status.className = failed ? "mb-3 text-danger" : "mb-3";
					status.textContent = message;
				}
				document.getElementById("resend-code").addEventListener("click", function () {
					if (!email || !name || !window.BryllaCheckout) {
						show("Start again from sign up.", true);
						return;
					}
					show("Sending a new link…", false);
					window.BryllaCheckout.post("signup-code", { action: "send", name: name, email: email }).then(function () {
						show("A new link is on its way. Open it to choose your password.", false);
					}).catch(function (error) {
						show(error.message || "The link could not be sent.", true);
					});
				});
			})();
		</script>
		
	</body>
</html>
